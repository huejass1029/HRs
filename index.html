<script>
const { useState, useEffect, useCallback, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

// MLB team abbrev → park key
const TEAM_TO_PARK = {
  ATL:"ATL",ARI:"ARI",BAL:"BAL",BOS:"BOS",CHC:"CHC",CWS:"CWS",CIN:"CIN",
  CLE:"CLE",COL:"COL",DET:"DET",HOU:"HOU",KC:"KC",LAA:"LAA",LAD:"LAD",
  MIA:"MIA",MIL:"MIL",MIN:"MIN",NYM:"NYM",NYY:"NYY",OAK:"ATH",ATH:"ATH",
  PHI:"PHI",PIT:"PIT",SD:"SD",SF:"SF",SEA:"SEA",STL:"STL",TB:"TB",
  TEX:"TEX",TOR:"TOR",WSH:"WSH",
};

const PROXY = "https://corsproxy.io/?";
function savantUrl(params) {
  return PROXY + encodeURIComponent("https://baseballsavant.mlb.com/leaderboard/custom?" + params + "&csv=true");
}
const PF_URL = PROXY + encodeURIComponent("https://baseballsavant.mlb.com/leaderboard/statcast-park-factors?type=year&year=2026&batSide=&stat=index_HR&csv=true");
const MLB_API = "https://statsapi.mlb.com/api/v1";

// ── HELPERS ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split("\n");
  if (lines.length < 2) return [];
  const headers = lines[0].split(",").map(h => h.trim().replace(/"/g,""));
  return lines.slice(1).map(line => {
    const vals=[]; let cur=""; let inQ=false;
    for(let c of line){
      if(c==='"') inQ=!inQ;
      else if(c===','&&!inQ){vals.push(cur);cur="";}
      else cur+=c;
    }
    vals.push(cur);
    const obj={};
    headers.forEach((h,i)=>{obj[h]=vals[i]?.trim().replace(/"/g,"")||"";});
    return obj;
  });
}

function n(v){const x=parseFloat(v);return isNaN(x)?null:x;}

function compassToDeg(dir){
  const m={N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,
           S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};
  return m[dir?.toUpperCase()]??0;
}

function parseWindSpeed(ws){
  if(!ws) return 0;
  const m=ws.match(/(\d+)/g);
  if(!m) return 0;
  return m.length>=2?(parseInt(m[0])+parseInt(m[1]))/2:parseInt(m[0]);
}

function windEffect(fromDeg, speedMph, cfDir, roof){
  if(roof) return {label:"🏟️ Dome",score:0,color:"#475569",detail:"Climate controlled"};
  if(speedMph<3) return {label:"🌫️ Calm",score:0,color:"#64748b",detail:`${speedMph.toFixed(0)} mph — negligible`};
  const toCF=(fromDeg+180)%360;
  let diff=Math.abs(toCF-cfDir);
  if(diff>180) diff=360-diff;
  const factor=Math.cos((diff*Math.PI)/180);
  const score=factor*speedMph;
  if(diff<=30) return {label:`💨 Blowing OUT to CF`,score,color:"#ef4444",detail:`${speedMph.toFixed(0)} mph — major HR boost`};
  if(diff<=60) return {label:`↗️ Out to corner`,score:score*0.7,color:"#f97316",detail:`${speedMph.toFixed(0)} mph — angled out`};
  if(diff<=120) return {label:`↔️ Crosswind`,score:score*0.1,color:"#eab308",detail:`${speedMph.toFixed(0)} mph — minimal effect`};
  if(diff<=150) return {label:`↙️ Partial headwind`,score,color:"#60a5fa",detail:`${speedMph.toFixed(0)} mph — slight suppression`};
  return {label:`🌬️ Blowing IN`,score,color:"#38bdf8",detail:`${speedMph.toFixed(0)} mph — suppresses HRs`};
}

function hrScore(barrelPct, hardHit, xslg, parkFactor, windScore, elev, isRoof){
  const base=(barrelPct*2.5)+(hardHit*0.4)+(xslg*20);
  const pm=(parkFactor||100)/100;
  const wb=isRoof?0:windScore*0.6;
  const eb=isRoof?0:(elev/1000)*2;
  return Math.min(99,Math.max(1,base*pm+wb+eb)).toFixed(0);
}

function scoreColor(s){
  const v=parseInt(s);
  if(v>=75) return "#ef4444";
  if(v>=60) return "#f97316";
  if(v>=45) return "#eab308";
  if(v>=30) return "#84cc16";
  return "#22c55e";
}

function ordinal(n){
  const s=["th","st","nd","rd"],v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

function today(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── MAIN APP ───────────────────────────────────────────────────────────────
function App(){
  const [games, setGames]           = useState([]);
  const [selectedGame, setSelectedGame] = useState(null);
  const [lineups, setLineups]       = useState(null);  // {home, away, homeSP, awaySP}
  const [lineupStatus, setLineupStatus] = useState("idle"); // idle|loading|ready|pending
  const [statcastData, setStatcastData] = useState({}); // keyed by player_id
  const [parkFactors, setParkFactors] = useState({});
  const [weather, setWeather]       = useState(null);
  const [windInfo, setWindInfo]     = useState(null);
  const [loading, setLoading]       = useState(true);
  const [refreshing, setRefreshing] = useState(false);
  const [viewTeam, setViewTeam]     = useState("away"); // which lineup to show
  const [sortMode, setSortMode]     = useState("order"); // order|score
  const [lastUpdated, setLastUpdated] = useState(null);
  const [error, setError]           = useState(null);

  const park = selectedGame
    ? PARKS[TEAM_TO_PARK[selectedGame.homeTeamAbbrev]] || null
    : null;

  // ── LOAD SCHEDULE ──
  async function loadSchedule(){
    const res = await fetch(`${MLB_API}/schedule?sportId=1&date=${today()}&hydrate=team`);
    const data = await res.json();
    const gs = [];
    (data.dates||[]).forEach(d=>{
      (d.games||[]).forEach(g=>{
        gs.push({
          gamePk: g.gamePk,
          status: g.status?.detailedState||"",
          time: g.gameDate,
          homeTeam: g.teams?.home?.team?.name||"",
          awayTeam: g.teams?.away?.team?.name||"",
          homeTeamAbbrev: g.teams?.home?.team?.abbreviation||"",
          awayTeamAbbrev: g.teams?.away?.team?.abbreviation||"",
          venueId: g.venue?.id,
          venueName: g.venue?.name||"",
        });
      });
    });
    return gs;
  }

  // ── LOAD LINEUPS ──
  async function loadLineup(gamePk){
    setLineupStatus("loading");
    setLineups(null);
    try {
      const [boxRes, feedRes] = await Promise.all([
        fetch(`${MLB_API}/game/${gamePk}/boxscore`),
        fetch(`${MLB_API}/game/${gamePk}/feed/live?fields=liveData,boxscore,teams,players,battingOrder,pitchers,probablePitchers,gameData,players`),
      ]);
      const box  = await boxRes.json();
      const feed = await feedRes.json();

      const homeBox = box.teams?.home;
      const awayBox = box.teams?.away;

      // Batting orders
      const homeBatters = (homeBox?.battingOrder||[]).map((id,idx)=>{
        const p=homeBox.players?.[`ID${id}`];
        return {
          id, slot:idx+1,
          name: p?.person?.fullName||"",
          battingHand: p?.person?.batSide?.code||"",
          position: p?.position?.abbreviation||"",
        };
      });
      const awayBatters = (awayBox?.battingOrder||[]).map((id,idx)=>{
        const p=awayBox.players?.[`ID${id}`];
        return {
          id, slot:idx+1,
          name: p?.person?.fullName||"",
          battingHand: p?.person?.batSide?.code||"",
          position: p?.position?.abbreviation||"",
        };
      });

      // Probable / confirmed starters
      const probHome = feed.gameData?.probablePitchers?.home;
      const probAway = feed.gameData?.probablePitchers?.away;

      // Check if lineups are actually posted (battingOrder populated)
      if(homeBatters.length===0 && awayBatters.length===0){
        setLineupStatus("pending");
        setLineups({
          homeSP: probHome ? {id:probHome.id, name:probHome.fullName} : null,
          awaySP: probAway ? {id:probAway.id, name:probAway.fullName} : null,
          home:[], away:[],
        });
        return;
      }

      setLineups({
        home: homeBatters,
        away: awayBatters,
        homeSP: probHome ? {id:probHome.id, name:probHome.fullName} : null,
        awaySP: probAway ? {id:probAway.id, name:probAway.fullName} : null,
      });
      setLineupStatus("ready");

      // Now fetch Statcast for all batter IDs
      const allIds = [...homeBatters,...awayBatters].map(b=>b.id);
      await fetchStatcastBatch(allIds);

    } catch(e){
      setLineupStatus("error");
      console.error(e);
    }
  }

  // ── STATCAST BATCH ──
  // Fetch season Statcast for a list of player IDs via Savant search
  async function fetchStatcastBatch(ids){
    if(!ids.length) return;
    // Savant custom leaderboard doesn't filter by ID list cleanly,
    // so we load the full qualified leaderboard and match by player_id
    // (already loaded in statcastData from the main load)
  }

  // ── LOAD SAVANT DATA ──
  async function loadSavant(){
    const [pfRes, batRes] = await Promise.all([
      fetch(PF_URL),
      fetch(savantUrl("year=2026&type=batter&filter=&min=25&selections=pa,home_run,barrel_batted_rate,exit_velocity_avg,hard_hit_percent,xslg,xwoba,xba")),
    ]);
    const pfText  = await pfRes.text();
    const batText = await batRes.text();

    const pfData = parseCSV(pfText);
    const pf={};
    pfData.forEach(r=>{
      const k=(r.team_abbrev||r.team||"").toUpperCase();
      if(k && r.index_HR) pf[k]=n(r.index_HR);
    });
    setParkFactors(pf);

    const batData = parseCSV(batText);
    const sc={};
    batData.forEach(r=>{
      if(r.player_id) sc[r.player_id]={
        barrel: n(r.barrel_batted_rate),
        ev:     n(r.exit_velocity_avg),
        hh:     n(r.hard_hit_percent),
        xslg:   n(r.xslg),
        xwoba:  n(r.xwoba),
        xba:    n(r.xba),
        hr:     n(r.home_run),
        pa:     n(r.pa),
      };
    });
    // Also index by last_name+first_name for fuzzy matching
    const scByName={};
    batData.forEach(r=>{
      const key=`${(r.last_name||"").toLowerCase()}_${(r.first_name||"").toLowerCase()}`;
      scByName[key]={
        barrel: n(r.barrel_batted_rate),
        ev:     n(r.exit_velocity_avg),
        hh:     n(r.hard_hit_percent),
        xslg:   n(r.xslg),
        xwoba:  n(r.xwoba),
        xba:    n(r.xba),
        hr:     n(r.home_run),
        pa:     n(r.pa),
      };
    });
    setStatcastData({byId:sc, byName:scByName});
    setLastUpdated(new Date().toLocaleTimeString());
  }

  // ── LOAD WEATHER ──
  async function loadWeather(p){
    if(!p) return;
    setWeather(null); setWindInfo(null);
    try {
      const ptRes = await fetch(`https://api.weather.gov/points/${p.lat},${p.lon}`);
      const ptData = await ptRes.json();
      const fUrl = ptData?.properties?.forecastHourly;
      if(!fUrl) throw new Error("no forecast");
      const fRes = await fetch(fUrl);
      const fData = await fRes.json();
      const now = fData?.properties?.periods?.[0];
      if(now){
        const speed=parseWindSpeed(now.windSpeed);
        const deg=compassToDeg(now.windDirection);
        const wi=windEffect(deg,speed,p.cfDir,p.roof);
        setWeather({temp:now.temperature,unit:now.temperatureUnit,wind:now.windSpeed,windDir:now.windDirection,forecast:now.shortForecast});
        setWindInfo(wi);
      }
    } catch(e){ setWeather({error:true}); }
  }

  // ── INITIAL LOAD ──
  async function initialLoad(){
    setLoading(true); setError(null);
    try {
      const [gs] = await Promise.all([loadSchedule(), loadSavant()]);
      setGames(gs);
      if(gs.length>0) setSelectedGame(gs[0]);
    } catch(e){ setError("Failed to load data. Check connection."); }
    setLoading(false);
  }

  // ── REFRESH ──
  async function handleRefresh(){
    setRefreshing(true);
    await Promise.all([loadSavant(), selectedGame && loadWeather(park)].filter(Boolean));
    if(selectedGame) await loadLineup(selectedGame.gamePk);
    setRefreshing(false);
  }

  useEffect(()=>{ initialLoad(); },[]);

  useEffect(()=>{
    if(selectedGame){
      loadLineup(selectedGame.gamePk);
      const p=PARKS[TEAM_TO_PARK[selectedGame.homeTeamAbbrev]];
      if(p) loadWeather(p);
    }
  },[selectedGame?.gamePk]);

  // ── STATCAST LOOKUP ──
  function getStatcast(batter){
    if(!statcastData.byId) return null;
    // Try by MLB player ID (Savant uses same IDs)
    const byId = statcastData.byId[String(batter.id)];
    if(byId) return byId;
    // Fallback: name match
    const parts = batter.name.split(" ");
    if(parts.length>=2){
      const key=`${parts[parts.length-1].toLowerCase()}_${parts[0].toLowerCase()}`;
      return statcastData.byName?.[key]||null;
    }
    return null;
  }

  // ── SP STATCAST (pitcher side — use xwoba allowed proxy) ──
  function getSPStats(sp){
    if(!sp||!statcastData.byId) return null;
    return statcastData.byId[String(sp.id)]||null;
  }

  // ── HR SCORE FOR A BATTER ──
  function getBatterScore(batter){
    const sc=getStatcast(batter);
    if(!sc) return null;
    const pfVal=parkFactors[TEAM_TO_PARK[selectedGame?.homeTeamAbbrev]||""]||100;
    const ws=windInfo?.score||0;
    const p=park||{elev:0,roof:false};
    return hrScore(sc.barrel||0, sc.hh||0, sc.xslg||0, pfVal, ws, p.elev, p.roof);
  }

  // ── WHICH SP IS THE OPPONENT? ──
  const activeSP = lineups
    ? (viewTeam==="away" ? lineups.homeSP : lineups.awaySP)
    : null;

  const activeBatters = lineups
    ? (viewTeam==="away" ? lineups.away : lineups.home)
    : [];

  const sortedBatters = useMemo(()=>{
    if(!activeBatters.length) return [];
    if(sortMode==="order") return [...activeBatters].sort((a,b)=>a.slot-b.slot);
    return [...activeBatters].sort((a,b)=>{
      const sa=parseInt(getBatterScore(a)||0);
      const sb=parseInt(getBatterScore(b)||0);
      return sb-sa;
    });
  },[activeBatters, sortMode, statcastData, windInfo, parkFactors]);

  // ── PARK FACTOR FOR SELECTED PARK ──
  const pfVal = park ? (parkFactors[park.abbrev]||100) : 100;

  // ── FORMAT GAME TIME ──
  function fmtTime(iso){
    if(!iso) return "";
    const d=new Date(iso);
    return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',timeZoneName:'short'});
  }

  // ── RENDER ─────────────────────────────────────────────────────────────────
  if(loading) return html`
    <div style=${{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",flexDirection:"column",gap:12}}>
      <div class="spin" style=${{width:40,height:40,border:"2px solid #1a2740",borderTop:"2px solid #38bdf8",borderRadius:"50%"}}/>
      <div style=${{fontSize:10,color:"#334155",letterSpacing:"0.14em"}}>LOADING MLB DATA...</div>
    </div>`;

  return html`
    <div style=${{minHeight:"100vh"}}>

      <!-- HEADER -->
      <div style=${{background:"linear-gradient(135deg,#0a1628 0%,#05080f 60%)",borderBottom:"1px solid #1a2740",padding:"16px 20px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style=${{fontSize:18,fontWeight:700,color:"#f8fafc",letterSpacing:"-0.3px"}}>⚾ MLB HR Engine</div>
          <div style=${{fontSize:9,color:"#334155",marginTop:3,letterSpacing:"0.14em",textTransform:"uppercase"}}>
            Statcast · Park Factors · Confirmed Lineups · Live Weather · ${today()}
          </div>
        </div>
        <div style=${{display:"flex",alignItems:"center",gap:12}}>
          ${lastUpdated && html`<div style=${{fontSize:9,color:"#334155"}}>Updated ${lastUpdated}</div>`}
          <button
            onClick=${handleRefresh}
            disabled=${refreshing}
            style=${{background:"#0d1829",border:"1px solid #38bdf8",color:"#38bdf8",padding:"7px 14px",fontSize:10,borderRadius:5,cursor:"pointer",letterSpacing:"0.08em",opacity:refreshing?0.6:1}}>
            ${refreshing?"⟳ Refreshing...":"⟳ Refresh Data"}
          </button>
        </div>
      </div>

      <!-- GAME SELECTOR -->
      <div style=${{background:"#080d18",borderBottom:"1px solid #1a2740",padding:"12px 20px",overflowX:"auto"}}>
        <div style=${{fontSize:9,color:"#38bdf8",letterSpacing:"0.14em",textTransform:"uppercase",marginBottom:8}}>Today's Games</div>
        ${error && html`<div style=${{color:"#ef4444",fontSize:11,marginBottom:8}}>${error}</div>`}
        ${games.length===0 && !loading && html`<div style=${{color:"#475569",fontSize:11}}>No games scheduled today.</div>`}
        <div style=${{display:"flex",gap:8,flexWrap:"wrap"}}>
          ${games.map(g=>{
            const active=selectedGame?.gamePk===g.gamePk;
            const started=g.status.includes("Progress")||g.status.includes("Final");
            return html`
              <button key=${g.gamePk}
                onClick=${()=>setSelectedGame(g)}
                style=${{
                  background: active?"#0d2040":"#0a1220",
                  border:`1px solid ${active?"#38bdf8":"#1a2740"}`,
                  color: active?"#38bdf8":"#94a3b8",
                  padding:"8px 12px",borderRadius:6,cursor:"pointer",
                  minWidth:140,textAlign:"left",
                }}>
                <div style=${{fontSize:11,fontWeight:700}}>${g.awayTeamAbbrev} @ ${g.homeTeamAbbrev}</div>
                <div style=${{fontSize:9,color:started?"#f97316":"#475569",marginTop:3}}>
                  ${started ? g.status : fmtTime(g.time)}
                </div>
              </button>`;
          })}
        </div>
      </div>

      ${selectedGame && html`
        <!-- PARK + WEATHER BAR -->
        <div style=${{background:"#070d18",borderBottom:"1px solid #1a2740",padding:"10px 20px",display:"flex",gap:20,flexWrap:"wrap",alignItems:"center"}}>
          <!-- Park -->
          <div>
            <div style=${{fontSize:9,color:"#38bdf8",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:2}}>Venue</div>
            <div style=${{fontSize:13,fontWeight:700,color:"#f1f5f9"}}>${park?.name||selectedGame.venueName}</div>
            <div style=${{fontSize:9,color:"#334155",marginTop:1}}>${park?.roof?"🏟️ Roof":"☀️ Open"} · ${park?.elev?.toLocaleString()||"—"}ft elevation</div>
          </div>
          <!-- PF -->
          <div>
            <div style=${{fontSize:9,color:"#38bdf8",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:2}}>HR Park Factor</div>
            <div style=${{fontSize:20,fontWeight:700,color:pfVal>105?"#ef4444":pfVal<95?"#38bdf8":"#94a3b8"}}>
              ${pfVal}
              <span style=${{fontSize:9,color:"#334155",marginLeft:5}}>
                ${pfVal>110?"🔥 Very HR-friendly":pfVal>105?"▲ HR-friendly":pfVal<90?"▼▼ HR-suppressing":pfVal<95?"▼ Suppressing":"≈ Neutral"}
              </span>
            </div>
          </div>
          <!-- Elevation -->
          <div>
            <div style=${{fontSize:9,color:"#38bdf8",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:2}}>Elev Carry</div>
            <div style=${{fontSize:16,fontWeight:700,color:park?.elev>2000?"#f97316":"#64748b"}}>
              +${park?((park.elev/1000)*1.0).toFixed(1):0}%
            </div>
          </div>
          <!-- Weather -->
          ${weather && !weather.error && html`
            <div>
              <div style=${{fontSize:9,color:"#38bdf8",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:2}}>Temp</div>
              <div style=${{fontSize:16,fontWeight:700,color:weather.temp>85?"#ef4444":weather.temp<50?"#38bdf8":"#94a3b8"}}>${weather.temp}°${weather.unit}</div>
            </div>
            <div>
              <div style=${{fontSize:9,color:"#38bdf8",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:2}}>Wind</div>
              <div style=${{fontSize:13,fontWeight:700,color:windInfo?.color||"#64748b"}}>${weather.windDir} ${weather.wind}</div>
              <div style=${{fontSize:9,color:windInfo?.color||"#475569",marginTop:1}}>${windInfo?.label||"—"}</div>
            </div>
            <div style=${{maxWidth:120}}>
              <div style=${{fontSize:9,color:"#38bdf8",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:2}}>Sky</div>
              <div style=${{fontSize:10,color:"#64748b"}}>${weather.forecast}</div>
            </div>
          `}
          ${!weather && html`<div class="pulse" style=${{fontSize:10,color:"#334155"}}>Loading weather...</div>`}
          ${weather?.error && html`<div style=${{fontSize:10,color:"#475569"}}>Weather unavailable</div>`}
        </div>

        <!-- LINEUP STATUS -->
        ${lineupStatus==="pending" && html`
          <div style=${{background:"#0a1220",borderBottom:"1px solid #1a2740",padding:"16px 20px",display:"flex",alignItems:"center",gap:12}}>
            <div class="pulse" style=${{width:8,height:8,borderRadius:"50%",background:"#eab308",flexShrink:0}}/>
            <div>
              <div style=${{fontSize:12,color:"#eab308",fontWeight:700}}>⏳ Lineup Not Yet Confirmed</div>
              <div style=${{fontSize:10,color:"#475569",marginTop:3}}>
                Lineups typically post 3–4 hours before first pitch. 
                ${lineups?.awaySP||lineups?.homeSP ? html`
                  Probable starters: 
                  ${lineups.awaySP?html`<span style=${{color:"#94a3b8"}}>${lineups.awaySP.name} (${selectedGame.awayTeamAbbrev})</span>`:"TBD"}
                  ${" vs "}
                  ${lineups.homeSP?html`<span style=${{color:"#94a3b8"}}>${lineups.homeSP.name} (${selectedGame.homeTeamAbbrev})</span>`:"TBD"}
                ` : "Check back closer to game time."}
              </div>
            </div>
            <button onClick=${()=>loadLineup(selectedGame.gamePk)}
              style=${{marginLeft:"auto",background:"#0d1829",border:"1px solid #1a2740",color:"#94a3b8",padding:"6px 12px",fontSize:10,borderRadius:5,cursor:"pointer"}}>
              ↺ Check Again
            </button>
          </div>
        `}

        ${lineupStatus==="loading" && html`
          <div style=${{padding:"20px",textAlign:"center"}}>
            <div class="spin" style=${{width:24,height:24,border:"2px solid #1a2740",borderTop:"2px solid #38bdf8",borderRadius:"50%",display:"inline-block"}}/>
            <div style=${{fontSize:10,color:"#334155",marginTop:8}}>Loading lineup...</div>
          </div>
        `}

        ${lineupStatus==="ready" && lineups && html`
          <!-- TEAM TOGGLE + SORT -->
          <div style=${{background:"#080d18",borderBottom:"1px solid #1a2740",padding:"12px 20px",display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
            <div style=${{fontSize:9,color:"#38bdf8",letterSpacing:"0.12em",textTransform:"uppercase"}}>Batting Lineup:</div>
            <div style=${{display:"flex",gap:6}}>
              <button onClick=${()=>setViewTeam("away")}
                style=${{padding:"5px 12px",fontSize:10,fontWeight:viewTeam==="away"?700:400,
                  color:viewTeam==="away"?"#0a0e1a":"#475569",
                  background:viewTeam==="away"?"#38bdf8":"#0d1829",
                  border:`1px solid ${viewTeam==="away"?"#38bdf8":"#1a2740"}`,
                  borderRadius:20,cursor:"pointer"}}>
                ${selectedGame.awayTeamAbbrev} (Away)
              </button>
              <button onClick=${()=>setViewTeam("home")}
                style=${{padding:"5px 12px",fontSize:10,fontWeight:viewTeam==="home"?700:400,
                  color:viewTeam==="home"?"#0a0e1a":"#475569",
                  background:viewTeam==="home"?"#38bdf8":"#0d1829",
                  border:`1px solid ${viewTeam==="home"?"#38bdf8":"#1a2740"}`,
                  borderRadius:20,cursor:"pointer"}}>
                ${selectedGame.homeTeamAbbrev} (Home)
              </button>
            </div>
            <div style=${{marginLeft:"auto",display:"flex",gap:6,alignItems:"center"}}>
              <div style=${{fontSize:9,color:"#334155"}}>Sort:</div>
              <button onClick=${()=>setSortMode("order")}
                style=${{padding:"4px 10px",fontSize:9,
                  color:sortMode==="order"?"#0a0e1a":"#475569",
                  background:sortMode==="order"?"#94a3b8":"#0d1829",
                  border:"1px solid #1a2740",borderRadius:20,cursor:"pointer"}}>
                Batting Order
              </button>
              <button onClick=${()=>setSortMode("score")}
                style=${{padding:"4px 10px",fontSize:9,
                  color:sortMode==="score"?"#0a0e1a":"#475569",
                  background:sortMode==="score"?"#ef4444":"#0d1829",
                  border:`1px solid ${sortMode==="score"?"#ef4444":"#1a2740"}`,borderRadius:20,cursor:"pointer"}}>
                HR Score ↓
              </button>
            </div>
          </div>

          <!-- OPPOSING SP HEADER -->
          <div style=${{padding:"10px 20px",background:"#060c16",borderBottom:"1px solid #1a2740",display:"flex",alignItems:"center",gap:10}}>
            <div style=${{fontSize:9,color:"#334155",textTransform:"uppercase",letterSpacing:"0.1em"}}>Opposing SP:</div>
            ${activeSP
              ? html`<div style=${{fontSize:13,fontWeight:700,color:"#f8fafc"}}>${activeSP.name}</div>
                     <div style=${{fontSize:9,color:"#475569",marginLeft:4}}>(${viewTeam==="away"?selectedGame.homeTeamAbbrev:selectedGame.awayTeamAbbrev})</div>`
              : html`<div style=${{fontSize:11,color:"#475569"}}>SP not yet confirmed</div>`
            }
          </div>

          <!-- LINEUP CARDS -->
          <div style=${{padding:"16px 20px"}}>
            ${sortedBatters.length===0 && html`
              <div style=${{color:"#475569",fontSize:11,textAlign:"center",padding:"30px 0"}}>
                No batting order data available yet.
              </div>
            `}
            <div style=${{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:10}}>
              ${sortedBatters.map((batter,idx)=>{
                const sc   = getStatcast(batter);
                const score= getBatterScore(batter);
                const sColor= score ? scoreColor(score) : "#475569";
                const hasData= !!sc;
                return html`
                  <div key=${batter.id}
                    style=${{
                      background:"#0a1220",
                      border:`1px solid ${score&&parseInt(score)>=60?sColor+"44":"#1a2740"}`,
                      borderRadius:8,overflow:"hidden",
                      boxShadow: score&&parseInt(score)>=60?`0 0 12px ${sColor}18`:"none",
                    }}>
                    <!-- Card header -->
                    <div style=${{
                      display:"flex",alignItems:"center",gap:10,padding:"10px 12px",
                      background: score&&parseInt(score)>=70?sColor+"14":"#060c16",
                      borderBottom:"1px solid #1a2740",
                    }}>
                      <!-- Batting order slot -->
                      <div style=${{
                        width:32,height:32,borderRadius:6,
                        background: sColor+"22",border:`1px solid ${sColor}44`,
                        display:"flex",alignItems:"center",justifyContent:"center",
                        flexDirection:"column",flexShrink:0,
                      }}>
                        <div style=${{fontSize:14,fontWeight:700,color:sColor,lineHeight:1}}>${batter.slot}</div>
                        <div style=${{fontSize:7,color:sColor+"88",lineHeight:1}}>${ordinal(batter.slot).slice(-2)}</div>
                      </div>
                      <!-- Name + info -->
                      <div style=${{flex:1,minWidth:0}}>
                        <div style=${{fontSize:13,fontWeight:700,color:"#f8fafc",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                          ${batter.name}
                        </div>
                        <div style=${{display:"flex",gap:6,marginTop:3,alignItems:"center"}}>
                          <span style=${{fontSize:9,color:"#475569",background:"#0d1829",padding:"1px 5px",borderRadius:3}}>${batter.position}</span>
                          <span style=${{fontSize:9,color:"#475569"}}>${batter.battingHand==="L"?"⬅️ LHB":batter.battingHand==="R"?"➡️ RHB":batter.battingHand==="S"?"↔️ Switch":"—"}</span>
                          ${!hasData && html`<span style=${{fontSize:9,color:"#334155"}}>No Statcast data</span>`}
                        </div>
                      </div>
                      <!-- HR Score -->
                      ${score && html`
                        <div style=${{
                          textAlign:"center",flexShrink:0,
                          background:sColor+"18",border:`1px solid ${sColor}44`,
                          borderRadius:8,padding:"4px 8px",minWidth:44,
                        }}>
                          <div style=${{fontSize:18,fontWeight:700,color:sColor,lineHeight:1}}>${score}</div>
                          <div style=${{fontSize:7,color:sColor+"99",letterSpacing:"0.1em",marginTop:1}}>HR⚡</div>
                        </div>
                      `}
                    </div>

                    <!-- Stats grid -->
                    ${hasData && html`
                      <div style=${{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:1,background:"#1a2740"}}>
                        ${[
                          ["Barrel%", sc.barrel?.toFixed(1)+"%", sc.barrel>=11?"#ef4444":sc.barrel>=7?"#f97316":sc.barrel>=4?"#eab308":"#64748b"],
                          ["Avg EV",  sc.ev?.toFixed(1),         sc.ev>=93?"#ef4444":sc.ev>=91?"#f97316":sc.ev>=89?"#eab308":"#64748b"],
                          ["HardHit%",sc.hh?.toFixed(1)+"%",     sc.hh>=50?"#ef4444":sc.hh>=44?"#f97316":sc.hh>=38?"#eab308":"#64748b"],
                          ["xSLG",   sc.xslg?.toFixed(3),        sc.xslg>=.520?"#ef4444":sc.xslg>=.450?"#f97316":sc.xslg>=.390?"#eab308":"#64748b"],
                          ["xwOBA",  sc.xwoba?.toFixed(3),       sc.xwoba>=.370?"#ef4444":sc.xwoba>=.340?"#f97316":sc.xwoba>=.310?"#eab308":"#64748b"],
                          ["HRs",    sc.hr?.toFixed(0),          sc.hr>=18?"#ef4444":sc.hr>=12?"#f97316":sc.hr>=7?"#eab308":"#64748b"],
                        ].map(([label,val,color])=>html`
                          <div style=${{background:"#070d18",padding:"7px 10px",textAlign:"center"}}>
                            <div style=${{fontSize:8,color:"#334155",textTransform:"uppercase",letterSpacing:"0.1em"}}>${label}</div>
                            <div style=${{fontSize:13,fontWeight:700,color:val?color:"#1e3a5f",marginTop:2}}>${val||"—"}</div>
                          </div>
                        `)}
                      </div>

                      <!-- Score bar -->
                      <div style=${{padding:"8px 12px",background:"#060c16",display:"flex",alignItems:"center",gap:8}}>
                        <div style=${{flex:1,height:3,background:"#1a2740",borderRadius:2,overflow:"hidden"}}>
                          <div style=${{height:"100%",width:`${score||0}%`,background:sColor,borderRadius:2,transition:"width 0.3s"}}/>
                        </div>
                        <div style=${{fontSize:9,color:"#334155",minWidth:80,textAlign:"right"}}>
                          PF:${pfVal} · ${park?.roof?"Dome":windInfo?.score>3?"💨Out":windInfo?.score<-3?"🌬️In":"↔️Cross"}
                        </div>
                      </div>
                    `}
                    ${!hasData && html`
                      <div style=${{padding:"12px",background:"#060c16",textAlign:"center"}}>
                        <div style=${{fontSize:10,color:"#1e3a5f"}}>Statcast data unavailable</div>
                        <div style=${{fontSize:9,color:"#0f1e33",marginTop:2}}>May be below PA threshold</div>
                      </div>
                    `}
                  </div>`;
              })}
            </div>
          </div>

          <!-- LEGEND -->
          <div style=${{padding:"10px 20px",borderTop:"1px solid #1a2740",display:"flex",gap:16,flexWrap:"wrap",alignItems:"center"}}>
            <div style=${{fontSize:9,color:"#334155",textTransform:"uppercase",letterSpacing:"0.1em"}}>HR⚡ Score:</div>
            ${[["#ef4444","75+ Elite"],["#f97316","60–74 High"],["#eab308","45–59 Mid"],["#84cc16","30–44 Low"],["#22c55e","<30 Very Low"]].map(([c,l])=>html`
              <div style=${{display:"flex",alignItems:"center",gap:5}}>
                <div style=${{width:8,height:8,borderRadius:"50%",background:c}}/>
                <span style=${{fontSize:9,color:"#475569"}}>${l}</span>
              </div>
            `)}
            <div style=${{marginLeft:"auto",fontSize:9,color:"#1e3a5f"}}>Score = barrel% + HH% + xSLG × park factor × wind × elevation</div>
          </div>
        `}
      `}
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
