<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MLB HR Engine</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f0f4f8;--bg2:#e8eef5;--bg3:#dce5ef;
  --border:#c8d6e5;--border2:#a8bdd0;
  --text:#1a2c3d;--dim:#6b8299;--accent:#0077cc;
  --mono:'JetBrains Mono',monospace;--display:'Barlow Condensed',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh}
header{
  position:sticky;top:0;z-index:100;height:52px;
  background:linear-gradient(180deg,#fff 0%,rgba(240,244,248,.97) 100%);
  border-bottom:1px solid var(--border2);
  box-shadow:0 1px 8px rgba(0,0,0,.07);
  display:flex;align-items:center;padding:0 20px;gap:16px;
}
.logo{font-family:var(--display);font-size:22px;font-weight:800;color:#0f1f2e;text-transform:uppercase;letter-spacing:.04em}
.logo span{color:var(--accent)}
.hdate{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.upd{font-size:9px;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 5px #16a34a88}
.dot.spin-state{background:#d97706;box-shadow:0 0 5px #d9770688;animation:pulse 1s infinite}
.rbtn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;background:transparent;
  border:1px solid var(--accent);color:var(--accent);padding:5px 13px;border-radius:3px;
  cursor:pointer;text-transform:uppercase;transition:all .15s}
.rbtn:hover{background:var(--accent);color:#fff}
.rbtn:disabled{opacity:.4;cursor:not-allowed}
.sbar{
  background:#fff;border-bottom:1px solid var(--border);
  padding:7px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.spill{font-size:10px;color:var(--dim)}
.spill strong{color:var(--text);margin-right:3px}
.srch-wrap{display:flex;align-items:center;gap:8px}
.srch{font-family:var(--mono);font-size:11px;background:#fff;border:1.5px solid var(--border2);
  color:var(--text);padding:5px 14px;border-radius:20px;outline:none;width:250px;
  transition:border-color .15s,box-shadow .15s}
.srch:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,119,204,.1)}
.srch::placeholder{color:#94a3b8}
.srch-ct{font-size:10px;color:var(--dim);min-width:55px}
.leg{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--dim)}
.ld{width:7px;height:7px;border-radius:50%}
#prog{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px}
.spin{width:38px;height:38px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
.pmsg{font-size:11px;color:var(--dim);letter-spacing:.08em}
#nolines{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:10px}
.nlicon{font-size:44px;opacity:.25}
.nlmsg{font-size:12px;color:var(--dim);letter-spacing:.08em}
#tbl{display:none;width:100%}
.thead{
  display:grid;
  grid-template-columns:36px 52px 2fr 0.7fr 0.7fr 1.1fr 1.5fr 1.3fr 1.3fr 1.3fr 1.8fr 1.8fr 1fr 28px;
  padding:7px 20px;gap:8px;background:var(--bg3);
  border-bottom:2px solid var(--border2);
  position:sticky;top:0;z-index:9;width:100%;
}
.th{font-size:10px;color:#4a6278;letter-spacing:.1em;text-transform:uppercase;font-weight:600;align-self:center}
.th.r{text-align:right}
.th.r{text-align:right}
.row{
  display:grid;
  grid-template-columns:36px 52px 2fr 0.7fr 0.7fr 1.1fr 1.5fr 1.3fr 1.3fr 1.3fr 1.8fr 1.8fr 1fr 28px;
  padding:0 20px;gap:8px;
  border-bottom:1px solid var(--border);border-left:3px solid transparent;
  cursor:pointer;transition:background .1s,border-color .15s;
  min-height:50px;align-items:center;width:100%;
}
.row:nth-child(4n+1),.row:nth-child(4n+2){background:#fff}
.row:nth-child(4n+3),.row:nth-child(4n+4){background:#f5f8fc}
.row:hover{background:#e4edf7!important}
.row.open{border-left-color:var(--rc,var(--accent))}
.badge{width:44px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;font-family:var(--display);
  background:color-mix(in srgb,var(--rc) 15%,white);
  border:1.5px solid color-mix(in srgb,var(--rc) 45%,transparent);color:var(--rc)}
.bname{font-size:12px;font-weight:700;color:#0f1f2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsub{font-size:10px;color:var(--dim);margin-top:2px}
.slot1{font-size:14px;font-weight:700;color:var(--rc);text-align:center}
.slot2{font-size:9px;color:var(--dim);text-align:center}
.hsym{font-size:13px;color:#475569;text-align:center}
.hlbl{font-size:9px;color:var(--dim);text-align:center}
.spl{font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spn{font-size:11px;color:#2c4a62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sps{font-size:10px;color:var(--dim)}
.sv{font-size:13px;font-weight:700;text-align:right}
.pn{font-size:11px;color:#4a6278;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfv{font-size:10px;margin-top:2px}
.wv{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv{font-size:11px;color:var(--dim);margin-top:2px}
.chev{font-size:13px;color:var(--dim);text-align:center;transition:transform .2s}
.row.open .chev{transform:rotate(180deg);color:var(--rc)}
.lpa{font-size:9px;color:#d97706;background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.3);border-radius:2px;padding:1px 5px;margin-left:5px;vertical-align:middle}
.exp{display:none;background:#e8f0fa;border-bottom:2px solid color-mix(in srgb,var(--rc) 30%,transparent);padding:14px 20px;animation:sd .15s ease}
.exp.open{display:block}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.ec{background:#fff;border-radius:6px;padding:12px;border:1px solid var(--border2);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ect{font-size:9px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;font-weight:700}
.bdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.bdl{font-size:9px;color:#475569}
.bdbw{display:flex;align-items:center;gap:6px}
.bdb{height:3px;border-radius:2px;opacity:.7}
.bdv{font-size:11px;font-weight:700;min-width:30px;text-align:right}
.btot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);margin-top:8px;padding-top:8px}
.btotl{font-size:9px;color:#475569}
.btotv{font-size:18px;font-weight:800;font-family:var(--display);color:var(--rc)}
.spu{margin-top:8px;padding:6px 8px;background:#f0f5fb;border-radius:4px;border:1px solid var(--border);font-size:9px}
.spul{color:var(--dim)}.spuv{color:var(--accent);font-weight:700;margin-top:2px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st{background:#f0f5fb;border-radius:4px;padding:6px 8px;border:1px solid var(--border)}
.stl{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.stv{font-size:13px;font-weight:700;margin-top:2px}
.er{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:9px}
.el{color:var(--dim);flex-shrink:0}.ev2{font-weight:700;text-align:right}
.sbar2{margin-top:8px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.sbf{height:100%;border-radius:2px;background:var(--rc);transition:width .4s}
.pvbox{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px 10px;background:#f0f5fb;border-radius:5px;border:1px solid var(--border2)}
.pvicon{font-size:18px;line-height:1}
.pvv{font-size:12px;font-weight:700}
.pvs{font-size:10px;color:#64748b;margin-top:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes sd{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.scoreboard{
  background:#fff;border-bottom:1px solid var(--border);
  padding:0 20px;overflow-x:auto;white-space:nowrap;
  display:flex;align-items:stretch;gap:0;
  scrollbar-width:none;height:52px;
}
.scoreboard::-webkit-scrollbar{display:none}
.sgame{
  display:inline-flex;flex-direction:column;justify-content:center;
  padding:0 14px;border-right:1px solid var(--border);
  min-width:120px;cursor:default;transition:background .12s;
  flex-shrink:0;
}
.sgame:first-child{padding-left:0}
.sgame:hover{background:#f5f8fc}
.sgame-teams{display:flex;flex-direction:column;gap:2px}
.sgame-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sgame-abbr{font-size:11px;font-weight:700;color:#1a2c3d;min-width:28px}
.sgame-abbr.winner{color:#0077cc}
.sgame-score{font-size:13px;font-weight:800;font-family:'Barlow Condensed',sans-serif;min-width:16px;text-align:right}
.sgame-score.winner{color:#0077cc}
.sgame-meta{font-size:9px;color:var(--dim);margin-top:3px;display:flex;align-items:center;gap:5px}
.sgame-live{font-size:9px;font-weight:700;color:#dc2626;letter-spacing:.04em}
.sgame-time{font-size:10px;color:#4a6278;font-weight:600}
.sgame-final{font-size:9px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.runners{display:flex;gap:2px;align-items:center}
.base{width:7px;height:7px;border:1.5px solid #cbd5e1;transform:rotate(45deg);background:transparent;transition:background .15s,border-color .15s}
.base.on{background:#d97706;border-color:#d97706}
.outs-dots{display:flex;gap:2px;align-items:center}
.out-dot{width:5px;height:5px;border-radius:50%;background:#cbd5e1}
.out-dot.on{background:#dc2626}
.scoreboard{
  background:#fff;border-bottom:1px solid var(--border);
  padding:0 12px;overflow-x:auto;white-space:nowrap;
  display:flex;align-items:center;gap:0;
  scrollbar-width:none;height:60px;
}
.scoreboard::-webkit-scrollbar{display:none}
.sgame{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 16px;border-right:1px solid var(--border);
  min-width:100px;cursor:default;transition:background .12s;
  flex-shrink:0;height:100%;text-align:center;
}
.sgame:first-child{padding-left:8px}
.sgame:hover{background:#f5f8fc}
.sgame-teams{display:flex;gap:10px;align-items:center;justify-content:center}
.sgame-team{display:flex;flex-direction:column;align-items:center;gap:2px}
.sgame-abbr{font-size:11px;font-weight:700;color:#1a2c3d;line-height:1}
.sgame-abbr.W{color:#0077cc}
.sgame-sc{font-size:15px;font-weight:800;font-family:'Barlow Condensed',sans-serif;line-height:1;color:#1a2c3d}
.sgame-sc.W{color:#0077cc}
.sgame-vs{font-size:9px;color:var(--dim);font-weight:600;align-self:center}
.sgame-meta{font-size:9px;color:var(--dim);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:5px}
.slive{font-size:9px;font-weight:700;color:#dc2626;letter-spacing:.04em}
.stime{font-size:10px;color:#4a6278;font-weight:600}
.sfinal{font-size:9px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.odots{display:flex;gap:2px;align-items:center}
.od{width:5px;height:5px;border-radius:50%;background:#cbd5e1}
.od.on{background:#dc2626}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#e8eef5}
::-webkit-scrollbar-thumb{background:#a8bdd0;border-radius:3px}
</style>
</head>
<body>
<header>
  <div class="logo">&#9918; HR <span>Engine</span></div>
  <div class="hdate" id="hdate"></div>
  <div class="hright">
    <span class="upd" id="upd"></span>
    <div class="dot" id="dot"></div>
    <button class="rbtn" id="rbtn" onclick="doRefresh()">&#8635; Refresh</button>
  </div>
</header>

<div class="scoreboard" id="scoreboard">
  <div class="sgame" style="min-width:80px;justify-content:center">
    <div style="font-size:9px;color:var(--dim);letter-spacing:.1em">LOADING...</div>
  </div>
</div>

<div class="scoreboard" id="scoreboard"></div>

<div class="sbar" id="sbar" style="display:none">
  <div class="spill"><strong id="bcnt">—</strong>batters ranked</div>
  <div class="spill">platoon splits + pitcher data</div>
  <div class="spill"><strong id="gcnt">—</strong>games confirmed</div>
  <div class="srch-wrap">
    <input class="srch" id="srch" placeholder="Search batter or pitcher..." oninput="doSearch(this.value)"/>
    <span class="srch-ct" id="srchct"></span>
  </div>
  <div class="leg">
    <div class="li"><div class="ld" style="background:#dc2626"></div>75+ Elite</div>
    <div class="li"><div class="ld" style="background:#d97706"></div>60-74 High</div>
    <div class="li"><div class="ld" style="background:#b45309"></div>45-59 Mid</div>
    <div class="li"><div class="ld" style="background:#16a34a"></div>30-44 Low</div>
    <div class="li"><div class="ld" style="background:#15803d"></div>&lt;30</div>
  </div>
</div>

<div id="prog"><div class="spin"></div><div class="pmsg" id="pmsg">Connecting...</div></div>
<div id="nolines"><div class="nlicon">&#9203;</div><div class="nlmsg">No confirmed lineups yet — check back closer to first pitch</div></div>
<div id="tbl">
  <div class="thead">
    <div class="th">#</div>
    <div class="th">Score</div>
    <div class="th">Batter</div>
    <div class="th" style="text-align:center">Slot</div>
    <div class="th" style="text-align:center">Hand</div>
    <div class="th">Split</div>
    <div class="th">vs SP</div>
    <div class="th" style="text-align:right">xSLG</div>
    <div class="th" style="text-align:right">Brl%</div>
    <div class="th" style="text-align:right">HH%</div>
    <div class="th">Park / PF</div>
    <div class="th">Wind</div>
    <div class="th" style="text-align:right">Temp</div>
    <div class="th"></div>
  </div>
  <div id="rows"></div>
</div>

<script>
var ws, rtimer, allData = [], expandedKey = null, nextRef = Date.now() + 300000;

function sc(s){
  if(s>=75)return'#dc2626';if(s>=60)return'#d97706';
  if(s>=45)return'#b45309';if(s>=30)return'#16a34a';return'#15803d';
}
function stc(v,k){
  var t={barrel:[4,7,11,15],ev:[87,89,91,93],hh:[32,38,44,50],xslg:[.33,.39,.45,.52],xwoba:[.28,.31,.34,.37],hr:[3,7,12,18]}[k];
  if(!t||v==null)return'#64748b';
  if(v>=t[3])return'#dc2626';if(v>=t[2])return'#d97706';
  if(v>=t[1])return'#b45309';if(v>=t[0])return'#16a34a';return'#64748b';
}
function pfc(p){if(p>108)return'#d97706';if(p>103)return'#b45309';if(p<93)return'#2563eb';if(p<97)return'#64748b';return'#64748b';}
function tc(t){if(!t||t==='—')return'#64748b';var d=parseInt(t);if(d>85)return'#dc2626';if(d<50)return'#2563eb';return'#64748b';}
function spl(k){if(k==='overall')return'Overall';var b={L:'LHB',R:'RHB'}[k[0]]||k[0],p={L:'LHP',R:'RHP'}[k[2]]||k[2];return b+' vs '+p;}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function hs(h){return h==='L'?'←':h==='S'?'↔':'→';}
function gtime(iso){
  if(!iso) return '';
  try{ return new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}); }
  catch(e){ return ''; }
}
function fmt(v,d){return v!=null?v.toFixed(d):'—';}

function buildExp(r,col){
  var bd=r.bd||{};
  var pvp=r.p_vuln!=null?Math.round((r.p_vuln-1.0)*100):null;
  var pvc=pvp==null?'#64748b':pvp>15?'#dc2626':pvp>5?'#d97706':pvp<-15?'#2563eb':pvp<-5?'#3b82f6':'#64748b';
  var pvv=pvp==null?'No pitcher data':pvp>15?'Very Hittable':pvp>5?'Hittable':pvp<-15?'Very Tough':pvp<-5?'Tough':'League Average';
  var pvi=pvp==null?'—':pvp>15?'🔴':pvp>5?'🟠':pvp<-15?'🔵':pvp<-5?'🟦':'⚪';
  var bars=[
    ['xSLG × park × pitcher',bd.xp,'#0077cc'],
    ['Barrel% × park × pitcher',bd.bp,'#dc2626'],
    ['HardHit% × park × pitcher',bd.hp,'#d97706'],
    ['Pitcher vuln adj',bd.pp||0,pvc],
    ['Wind bonus',bd.wp,r.wind_color||'#64748b'],
    ['Elevation bonus',bd.ep,'#7c3aed']
  ];
  var barsH=bars.map(function(x){
    var label=x[0],val=x[1]||0,color=x[2];
    return '<div class="bdr"><span class="bdl">'+label+'</span><div class="bdbw"><div class="bdb" style="width:'+Math.max(2,Math.min(60,Math.abs(val)*1.4))+'px;background:'+color+'"></div><span class="bdv" style="color:'+(val>=0?color:'#3b82f6')+'">'+(val>=0?'+':'')+val.toFixed(1)+'</span></div></div>';
  }).join('');
  var bstats=[
    ['xSLG',fmt(r.xslg,3),'xslg',r.xslg],['Barrel%',r.barrel!=null?r.barrel.toFixed(1)+'%':'—','barrel',r.barrel],
    ['HardHit%',r.hh!=null?r.hh.toFixed(1)+'%':'—','hh',r.hh],['Avg EV',r.ev!=null?r.ev.toFixed(1)+' mph':'—','ev',r.ev],
    ['xwOBA',fmt(r.xwoba,3),'xwoba',r.xwoba],['HRs',r.hr!=null?r.hr.toFixed(0):'—','hr',r.hr],['PA (split)',r.pa!=null?r.pa.toFixed(0):'—',null,null]
  ];
  var bstH=bstats.map(function(x){return '<div class="st"><div class="stl">'+x[0]+'</div><div class="stv" style="color:'+(x[2]?stc(x[3],x[2]):'#64748b')+'">'+x[1]+'</div></div>';}).join('');
  var pstats=[
    ['xSLG allowed',fmt(r.p_xslg,3),'xslg',r.p_xslg],['Barrel% allowed',r.p_barrel!=null?r.p_barrel.toFixed(1)+'%':'—','barrel',r.p_barrel],
    ['HardHit% allowed',r.p_hh!=null?r.p_hh.toFixed(1)+'%':'—','hh',r.p_hh],['EV allowed',r.p_ev!=null?r.p_ev.toFixed(1)+' mph':'—','ev',r.p_ev],
    ['xwOBA allowed',fmt(r.p_xwoba,3),'xwoba',r.p_xwoba]
  ];
  var pstH=pstats.map(function(x){return '<div class="st"><div class="stl">'+x[0]+'</div><div class="stv" style="color:'+(x[2]?stc(x[3],x[2]):'#64748b')+'">'+x[1]+'</div></div>';}).join('');
  var pfd=r.pf>105?'▲ HR-friendly':r.pf<95?'▼ Suppressing':'≈ Neutral';
  var env=[['Venue',r.park_name,'#4a6278'],['HR Park Factor',r.pf+' '+pfd,pfc(r.pf)],
           ['Temp',r.temp,tc(r.temp)],['Wind',r.wind_label,r.wind_color||'#64748b'],['Sky',r.forecast||'—','#64748b']];
  var envH=env.map(function(x){return '<div class="er"><span class="el">'+x[0]+'</span><span class="ev2" style="color:'+x[2]+'">'+x[1]+'</span></div>';}).join('');
  return '<div class="egrid">'
    +'<div class="ec"><div class="ect">&#9889; Score Breakdown</div>'+barsH
    +'<div class="btot"><span class="btotl">Total HR&#9889;</span><span class="btotv">'+Math.round(r.score)+'</span></div>'
    +'<div class="spu"><div class="spul">Batter stats</div><div class="spuv">'+spl(r.split)+(r.low_pa?' · ⚠ '+r.pa+' PA':'')+'</div></div>'
    +'<div class="sbar2"><div class="sbf" style="width:'+r.score+'%"></div></div></div>'
    +'<div class="ec"><div class="ect">&#129382; Batter — '+spl(r.split)+'</div><div class="sgrid">'+bstH+'</div></div>'
    +'<div class="ec"><div class="ect">&#9935; Pitcher — '+r.sp_name+'</div>'
    +'<div class="pvbox"><div class="pvicon">'+pvi+'</div><div><div class="pvv" style="color:'+pvc+'">'+pvv+'</div>'
    +'<div class="pvs">'+(pvp!=null?(pvp>0?'+':'')+pvp+'% vs league avg':'No Statcast data')+'</div></div></div>'
    +'<div class="sgrid">'+pstH+'</div></div>'
    +'<div class="ec"><div class="ect">&#127967; Park + Weather</div>'+envH+'</div>'
    +'</div>';
}

function renderRows(rows){
  var c=document.getElementById('rows');
  c.innerHTML='';
  rows.forEach(function(r,idx){
    var key=r.name+'-'+r.team+'-'+r.slot;
    var col=sc(r.score);
    var sfx=ord(r.slot).replace(r.slot,'');
    var ph=r.sp_hand==='L'?'LHP':r.sp_hand==='R'?'RHP':'?';
    var pfc2=pfc(r.pf);
    var pfa=r.pf>105?' ▲':r.pf<95?' ▼':'';
    var splc=r.split==='overall'?'#64748b':'#0077cc';
    var open=expandedKey===key;

    var row=document.createElement('div');
    row.className='row'+(open?' open':'');
    row.style.setProperty('--rc',col);
    row.dataset.key=key;
    row.dataset.sk=(r.name+' '+r.sp_name+' '+r.team+' '+r.vs_team).toLowerCase();
    row.innerHTML=
      '<div style="font-size:11px;color:var(--dim);text-align:right">'+(idx+1)+'</div>'
      +'<div class="badge">'+Math.round(r.score)+'</div>'
      +'<div><div class="bname">'+r.name+(r.low_pa?'<span class="lpa">⚠ Low PA</span>':'')+'</div>'
      +'<div class="bsub">'+r.team+' · '+r.pos+' · <span style="color:'+splc+'">'+spl(r.split)+'</span>'
      +(r.game_time?' · <span style="color:#64748b">'+gtime(r.game_time)+'</span>':'')
      +'</div></div>'
      +'<div><div class="slot1">'+r.slot+'</div><div class="slot2">'+sfx+'</div></div>'
      +'<div><div class="hsym">'+hs(r.hand)+'</div><div class="hlbl">'+(r.hand||'?')+'</div></div>'
      +'<div class="spl" style="color:'+splc+'">'+spl(r.split)+'</div>'
      +'<div><div class="spn">'+r.sp_name+'</div><div class="sps">'+r.vs_team+' · '+ph+'</div></div>'
      +'<div class="sv" style="color:'+stc(r.xslg,'xslg')+'">'+fmt(r.xslg,3)+'</div>'
      +'<div class="sv" style="color:'+stc(r.barrel,'barrel')+'">'+(r.barrel!=null?r.barrel.toFixed(1)+'%':'—')+'</div>'
      +'<div class="sv" style="color:'+stc(r.hh,'hh')+'">'+(r.hh!=null?r.hh.toFixed(1)+'%':'—')+'</div>'
      +'<div><div class="pn">'+r.park_name+'</div><div class="pfv" style="color:'+pfc2+'">PF '+r.pf+pfa+'</div></div>'

      +'<div><div class="wv" style="color:'+r.wind_color+'">'+r.wind_short+'</div></div>'
      +'<div><div class="tv" style="color:'+tc(r.temp)+'">'+r.temp+'</div>'
      +'<div style="font-size:10px;color:var(--dim);margin-top:2px">'+(r.forecast||'').split(' ').slice(0,2).join(' ')+'</div></div>'
      +'<div class="chev">&#9662;</div>';
    row.addEventListener('click',function(){toggle(key,r,col,row);});
    c.appendChild(row);

    var exp=document.createElement('div');
    exp.className='exp'+(open?' open':'');
    exp.id='exp_'+key.replace(/[^a-z0-9]/gi,'_');
    exp.style.setProperty('--rc',col);
    if(open) exp.innerHTML=buildExp(r,col);
    c.appendChild(exp);
  });
}

function toggle(key,r,col,rowEl){
  var eid='exp_'+key.replace(/[^a-z0-9]/gi,'_');
  var expEl=document.getElementById(eid);
  var wasOpen=expandedKey===key;
  expandedKey=wasOpen?null:key;
  document.querySelectorAll('.row.open').forEach(function(el){el.classList.remove('open');});
  document.querySelectorAll('.exp.open').forEach(function(el){el.classList.remove('open');el.innerHTML='';});
  if(!wasOpen&&expEl){
    rowEl.classList.add('open');
    expEl.innerHTML=buildExp(r,col);
    expEl.classList.add('open');
  }
}

function doSearch(q){
  var v=q.toLowerCase().trim();
  var c=document.getElementById('rows');
  var kids=Array.from(c.children);
  var vis=0,i=0;
  while(i<kids.length){
    var re=kids[i],xe=kids[i+1];i+=2;
    if(!re||!re.classList.contains('row')){i--;continue;}
    var match=!v||re.dataset.sk.includes(v);
    re.style.display=match?'':'none';
    if(xe&&xe.classList.contains('exp'))xe.style.display=match?'':'none';
    if(match){vis++;var rk=re.querySelector('div');if(rk)rk.textContent=vis;}
  }
  var ct=document.getElementById('srchct');
  if(ct)ct.textContent=v?(vis+' result'+(vis!==1?'s':'')):'';
}

function setLoading(on){
  document.getElementById('dot').className='dot'+(on?' spin-state':'');
  var b=document.getElementById('rbtn');
  b.disabled=on;b.textContent=on?'⟳ Loading...':'⟳ Refresh';
}

function renderData(data){
  document.getElementById('prog').style.display='none';
  document.getElementById('nolines').style.display='none';
  if(rows.length) document.getElementById('sbar').style.display='flex';
  else document.getElementById('sbar').style.display='none';
  var rows=data.rows||[];
  document.getElementById('bcnt').textContent=rows.length;
  document.getElementById('gcnt').textContent=data.confirmed||0;
  lastUpdated=data.updated;
  document.getElementById('upd').textContent='Updated '+data.updated;
  document.getElementById('srch').value='';
  document.getElementById('srchct').textContent='';
  if(!rows.length){
    document.getElementById('tbl').style.display='none';
    document.getElementById('nolines').style.display='flex';
    return;
  }
  allData=rows;
  document.getElementById('tbl').style.display='block';
  renderRows(rows);
}

function renderScoreboard(games){
  var sb=document.getElementById('scoreboard');
  if(!sb||!games||!games.length){return;}
  sb.innerHTML='';
  games.forEach(function(g){
    var div=document.createElement('div');
    div.className='sgame';
    var abs=g.abstract||'';
    var isLive=abs==='Live';
    var isFinal=abs==='Final';
    var isPre=!isLive&&!isFinal;
    var localTime='';
    if(g.time){try{localTime=new Date(g.time).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}catch(e){}}

    // Build team rows
    var awayW=isFinal&&g.away_score>g.home_score;
    var homeW=isFinal&&g.home_score>g.away_score;
    var awayScoreStr=g.away_score!=null?g.away_score:'';
    var homeScoreStr=g.home_score!=null?g.home_score:'';

    var teamsH='<div class="sgame-teams">'
      +'<div class="sgame-row">'
      +'<span class="sgame-abbr'+(awayW?' winner':'')+'">'+g.away+'</span>'
      +(isLive||isFinal?'<span class="sgame-score'+(awayW?' winner':'')+'">'+awayScoreStr+'</span>':'')
      +'</div>'
      +'<div class="sgame-row">'
      +'<span class="sgame-abbr'+(homeW?' winner':'')+'">'+g.home+'</span>'
      +(isLive||isFinal?'<span class="sgame-score'+(homeW?' winner':'')+'">'+homeScoreStr+'</span>':'')
      +'</div>'
      +'</div>';

    // Build meta row
    var metaH='<div class="sgame-meta">';
    if(isLive){
      // Inning indicator
      var half=g.inning_half==='Top'?'▲':'▼';
      metaH+='<span class="sgame-live">'+half+' '+g.inning+'</span>';
      // Runners
      metaH+='<div class="runners">'
        +'<div class="base'+(g.runners&&g.runners.second?' on':'')+'"></div>'
        +'</div>'
        +'<div class="runners" style="margin-top:-4px;display:flex;gap:2px">'
        +'<div class="base'+(g.runners&&g.runners.third?' on':'')+'"></div>'
        +'<div class="base'+(g.runners&&g.runners.first?' on':'')+'"></div>'
        +'</div>';
      // Outs
      var outs=g.outs||0;
      metaH+='<div class="outs-dots">'
        +'<div class="out-dot'+(outs>=1?' on':'')+'"></div>'
        +'<div class="out-dot'+(outs>=2?' on':'')+'"></div>'
        +'</div>';
    } else if(isFinal){
      metaH+='<span class="sgame-final">Final</span>';
    } else {
      var st=g.status||'';
      if(st==='Warmup'||st==='Pre-Game'){
        metaH+='<span style="font-size:9px;color:#d97706;font-weight:700">'+st+'</span>';
      } else {
        metaH+='<span class="sgame-time">'+localTime+'</span>';
      }
    }
    metaH+='</div>';

    div.innerHTML=teamsH+metaH;
    sb.appendChild(div);
  });
}

  fetch('http://localhost:8000/games').then(function(r){return r.json();}).then(function(d){
    if(d.games) renderScoreboard(d.games);
  }).catch(function(){});

function connect(){
  ws=new WebSocket('ws://localhost:8000/ws');
  ws.onopen=function(){clearTimeout(rtimer);setLoading(false);document.getElementById('pmsg').textContent='Connected — loading data...';};
  ws.onmessage=function(e){
    var m=JSON.parse(e.data);
    if(m.type==='progress'){
      setLoading(true);
      document.getElementById('prog').style.display='flex';
      document.getElementById('tbl').style.display='none';
      document.getElementById('pmsg').textContent=m.msg;
    } else if(m.type==='data'){
      setLoading(false);renderData(m.data);nextRef=Date.now()+300000;
    }
  };
  ws.onclose=function(){setLoading(true);rtimer=setTimeout(connect,3000);};
  ws.onerror=function(){ws.close();};
}

function doRefresh(){
  setLoading(true);
  document.getElementById('prog').style.display='flex';
  document.getElementById('tbl').style.display='none';
  document.getElementById('pmsg').textContent='Refreshing...';
  fetch('http://localhost:8000/refresh',{method:'POST'});
}

document.getElementById('hdate').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
connect();
loadScoreboard();
setInterval(loadScoreboard, 30000);

var lastUpdated='';
setInterval(function(){
  var s=Math.max(0,Math.round((nextRef-Date.now())/1000));
  var m=Math.floor(s/60),sec=s%60;
  var upd=document.getElementById('upd');
  var btn=document.getElementById('rbtn');
  if(allData.length&&!btn.disabled&&lastUpdated){
    upd.textContent='Updated '+lastUpdated+' · next in '+m+':'+String(sec).padStart(2,'0');
  }
},1000);
</script>
