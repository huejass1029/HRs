<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MLB HR Engine</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f0f4f8;--bg2:#e8eef5;--bg3:#dce5ef;
  --border:#c8d6e5;--border2:#a8bdd0;
  --text:#1a2c3d;--dim:#6b8299;--accent:#0077cc;
  --mono:'JetBrains Mono',monospace;--display:'Barlow Condensed',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh}
header{position:sticky;top:0;z-index:100;height:52px;background:linear-gradient(180deg,#fff 0%,rgba(240,244,248,.97) 100%);border-bottom:1px solid var(--border2);box-shadow:0 1px 8px rgba(0,0,0,.07);display:flex;align-items:center;padding:0 20px;gap:16px}
.logo{font-family:var(--display);font-size:22px;font-weight:800;color:#0f1f2e;text-transform:uppercase;letter-spacing:.04em}
.logo span{color:var(--accent)}
.hdate{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.upd{font-size:9px;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 5px #16a34a88}
.dot.loading{background:#d97706;box-shadow:0 0 5px #d9770688;animation:pulse 1s infinite}
.rbtn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;background:transparent;border:1px solid var(--accent);color:var(--accent);padding:5px 13px;border-radius:3px;cursor:pointer;text-transform:uppercase;transition:all .15s}
.rbtn:hover{background:var(--accent);color:#fff}
.rbtn:disabled{opacity:.4;cursor:not-allowed}
.scoreboard{background:#fff;border-bottom:1px solid var(--border);padding:0 12px;overflow-x:auto;white-space:nowrap;display:flex;align-items:center;gap:0;scrollbar-width:none;height:60px}
.scoreboard::-webkit-scrollbar{display:none}
.sgame{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;border-right:1px solid var(--border);min-width:100px;cursor:default;transition:background .12s;flex-shrink:0;height:100%;text-align:center}
.sgame:hover{background:#f5f8fc}
.sgame-teams{display:flex;gap:10px;align-items:center;justify-content:center}
.sgame-team{display:flex;flex-direction:column;align-items:center;gap:2px}
.sgame-abbr{font-size:11px;font-weight:700;color:#1a2c3d;line-height:1}
.sgame-abbr.W{color:#0077cc}
.sgame-sc{font-size:15px;font-weight:800;font-family:var(--display);line-height:1;color:#1a2c3d}
.sgame-sc.W{color:#0077cc}
.sgame-vs{font-size:9px;color:var(--dim);font-weight:600;align-self:center}
.sgame-meta{font-size:9px;color:var(--dim);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:5px}
.slive{font-size:9px;font-weight:700;color:#dc2626;letter-spacing:.04em}
.stime{font-size:10px;color:#4a6278;font-weight:600}
.sfinal{font-size:9px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.odots{display:flex;gap:2px;align-items:center}
.od{width:5px;height:5px;border-radius:50%;background:#cbd5e1}
.od.on{background:#dc2626}
.sbar{background:#fff;border-bottom:1px solid var(--border);padding:7px 20px;display:none;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.spill{font-size:10px;color:var(--dim)}
.spill strong{color:var(--text);margin-right:3px}
.srch-wrap{display:flex;align-items:center;gap:8px}
.srch{font-family:var(--mono);font-size:11px;background:#fff;border:1.5px solid var(--border2);color:var(--text);padding:5px 14px;border-radius:20px;outline:none;width:250px;transition:border-color .15s,box-shadow .15s}
.srch:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,119,204,.1)}
.srch::placeholder{color:#94a3b8}
.srch-ct{font-size:10px;color:var(--dim);min-width:55px}
.leg{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--dim)}
.ld{width:7px;height:7px;border-radius:50%}
#prog{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px}
.spin{width:38px;height:38px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
.pmsg{font-size:11px;color:var(--dim);letter-spacing:.08em}
#nolines{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:10px}
.nlicon{font-size:44px;opacity:.25}
.nlmsg{font-size:12px;color:var(--dim);letter-spacing:.08em}
#tbl{display:none;width:100%}
.thead{display:grid;grid-template-columns:36px 52px 2fr 0.7fr 0.7fr 1.1fr 1.5fr 1.3fr 1.3fr 1.3fr 1.8fr 1.8fr 1fr 28px;padding:7px 20px;gap:8px;background:var(--bg3);border-bottom:2px solid var(--border2);position:sticky;top:0;z-index:9;width:100%}
.th{font-size:10px;color:#4a6278;letter-spacing:.1em;text-transform:uppercase;font-weight:600;align-self:center}
.th.r{text-align:right}
.row{display:grid;grid-template-columns:36px 52px 2fr 0.7fr 0.7fr 1.1fr 1.5fr 1.3fr 1.3fr 1.3fr 1.8fr 1.8fr 1fr 28px;padding:0 20px;gap:8px;border-bottom:1px solid var(--border);border-left:3px solid transparent;cursor:pointer;transition:background .1s,border-color .15s;min-height:50px;align-items:center;width:100%}
.row:nth-child(4n+1),.row:nth-child(4n+2){background:#fff}
.row:nth-child(4n+3),.row:nth-child(4n+4){background:#f5f8fc}
.row:hover{background:#e4edf7!important}
.row.open{border-left-color:var(--rc,var(--accent))}
.badge{width:44px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:var(--display);background:color-mix(in srgb,var(--rc) 15%,white);border:1.5px solid color-mix(in srgb,var(--rc) 45%,transparent);color:var(--rc)}
.bname{font-size:12px;font-weight:700;color:#0f1f2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsub{font-size:10px;color:var(--dim);margin-top:2px}
.slot1{font-size:14px;font-weight:700;color:var(--rc);text-align:center}
.slot2{font-size:9px;color:var(--dim);text-align:center}
.hsym{font-size:13px;color:#475569;text-align:center}
.hlbl{font-size:9px;color:var(--dim);text-align:center}
.spl{font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spn{font-size:11px;color:#2c4a62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sps{font-size:10px;color:var(--dim)}
.sv{font-size:13px;font-weight:700;text-align:right}
.pn{font-size:11px;color:#4a6278;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfv{font-size:10px;margin-top:2px}
.wv{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv{font-size:11px;color:var(--dim);margin-top:2px}
.chev{font-size:13px;color:var(--dim);text-align:center;transition:transform .2s}
.row.open .chev{transform:rotate(180deg);color:var(--rc)}
.lpa{font-size:9px;color:#d97706;background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.3);border-radius:2px;padding:1px 5px;margin-left:5px;vertical-align:middle}
.exp{display:none;background:#e8f0fa;border-bottom:2px solid color-mix(in srgb,var(--rc) 30%,transparent);padding:14px 20px;animation:sd .15s ease}
.exp.open{display:block}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.ec{background:#fff;border-radius:6px;padding:12px;border:1px solid var(--border2);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ect{font-size:9px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;font-weight:700}
.bdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.bdl{font-size:9px;color:#475569}
.bdbw{display:flex;align-items:center;gap:6px}
.bdb{height:3px;border-radius:2px;opacity:.7}
.bdv{font-size:11px;font-weight:700;min-width:30px;text-align:right}
.btot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);margin-top:8px;padding-top:8px}
.btotl{font-size:9px;color:#475569}
.btotv{font-size:18px;font-weight:800;font-family:var(--display);color:var(--rc)}
.spu{margin-top:8px;padding:6px 8px;background:#f0f5fb;border-radius:4px;border:1px solid var(--border);font-size:9px}
.spul{color:var(--dim)}.spuv{color:var(--accent);font-weight:700;margin-top:2px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st{background:#f0f5fb;border-radius:4px;padding:6px 8px;border:1px solid var(--border)}
.stl{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.stv{font-size:13px;font-weight:700;margin-top:2px}
.er{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:9px}
.el{color:var(--dim);flex-shrink:0}.ev2{font-weight:700;text-align:right}
.sbar2{margin-top:8px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.sbf{height:100%;border-radius:2px;background:var(--rc);transition:width .4s}
.pvbox{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px 10px;background:#f0f5fb;border-radius:5px;border:1px solid var(--border2)}
.pvicon{font-size:18px;line-height:1}
.pvv{font-size:12px;font-weight:700}
.pvs{font-size:10px;color:#64748b;margin-top:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes sd{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#e8eef5}
::-webkit-scrollbar-thumb{background:#a8bdd0;border-radius:3px}
</style>
</head>
<body>
<header>
  <div class="logo">&#9918; HR <span>Engine</span></div>
  <div class="hdate" id="hdate"></div>
  <div class="hright">
    <span class="upd" id="upd"></span>
    <div class="dot" id="dot"></div>
    <button class="rbtn" id="rbtn" onclick="loadAll()">&#8635; Refresh</button>
  </div>
</header>

<div class="scoreboard" id="scoreboard"></div>

<div class="sbar" id="sbar">
  <div class="spill"><strong id="bcnt">—</strong>batters ranked</div>
  <div class="spill">platoon splits + pitcher data</div>
  <div class="spill"><strong id="gcnt">—</strong>games confirmed</div>
  <div class="srch-wrap">
    <input class="srch" id="srch" placeholder="Search batter or pitcher..." oninput="doSearch(this.value)"/>
    <span class="srch-ct" id="srchct"></span>
  </div>
  <div class="leg">
    <div class="li"><div class="ld" style="background:#dc2626"></div>75+ Elite</div>
    <div class="li"><div class="ld" style="background:#d97706"></div>60-74 High</div>
    <div class="li"><div class="ld" style="background:#b45309"></div>45-59 Mid</div>
    <div class="li"><div class="ld" style="background:#16a34a"></div>30-44 Low</div>
    <div class="li"><div class="ld" style="background:#15803d"></div>&lt;30</div>
  </div>
</div>

<div id="prog"><div class="spin"></div><div class="pmsg" id="pmsg">Loading MLB data...</div></div>
<div id="nolines"><div class="nlicon">&#9203;</div><div class="nlmsg">No confirmed lineups yet — check back closer to first pitch</div></div>
<div id="tbl">
  <div class="thead">
    <div class="th">#</div>
    <div class="th">Score</div>
    <div class="th">Batter</div>
    <div class="th" style="text-align:center">Slot</div>
    <div class="th" style="text-align:center">Hand</div>
    <div class="th">Split</div>
    <div class="th">vs SP</div>
    <div class="th r">xSLG</div>
    <div class="th r">Brl%</div>
    <div class="th r">HH%</div>
    <div class="th">Park / PF</div>
    <div class="th">Wind</div>
    <div class="th r">Temp</div>
    <div class="th"></div>
  </div>
  <div id="rows"></div>
</div>

<script>
// ── CONSTANTS ────────────────────────────────────────────────────────────────
var MLB = 'https://statsapi.mlb.com/api/v1';
var PROXY = 'https://api.allorigins.win/get?url=';
var YEAR = new Date().getFullYear().toString();
var LOW_PA = 40;
var REFRESH_MS = 300000;
var PITCHER_AVG = {barrel:8.0, hh:37.0, xslg:0.420};

var PF = {COL:140,CIN:115,TEX:112,BAL:111,PHI:110,BOS:109,NYY:108,ATL:107,MIL:106,CHC:105,
          HOU:104,LAA:103,MIN:102,CLE:101,DET:101,STL:100,TB:100,TOR:99,KC:99,WSH:98,
          LAD:97,NYM:97,PIT:96,SF:95,SEA:95,MIA:94,ATH:93,SD:92,ARI:91,CWS:89};

var PARKS = {
  ATL:{name:'Truist Park',cfDir:5,lat:33.8908,lon:-84.4678,roof:false,elev:1050},
  ARI:{name:'Chase Field',cfDir:345,lat:33.4453,lon:-112.0667,roof:true,elev:1082},
  BAL:{name:'Camden Yards',cfDir:50,lat:39.2839,lon:-76.6217,roof:false,elev:20},
  BOS:{name:'Fenway Park',cfDir:95,lat:42.3467,lon:-71.0972,roof:false,elev:10},
  CHC:{name:'Wrigley Field',cfDir:45,lat:41.9484,lon:-87.6553,roof:false,elev:595},
  CWS:{name:'Guaranteed Rate Field',cfDir:135,lat:41.83,lon:-87.6339,roof:false,elev:595},
  CIN:{name:'Great American Ball Park',cfDir:15,lat:39.0979,lon:-84.5082,roof:false,elev:490},
  CLE:{name:'Progressive Field',cfDir:10,lat:41.4962,lon:-81.6852,roof:false,elev:653},
  COL:{name:'Coors Field',cfDir:20,lat:39.7559,lon:-104.9942,roof:false,elev:5200},
  DET:{name:'Comerica Park',cfDir:155,lat:42.339,lon:-83.0485,roof:false,elev:584},
  HOU:{name:'Minute Maid Park',cfDir:30,lat:29.7572,lon:-95.3555,roof:true,elev:43},
  KC:{name:'Kauffman Stadium',cfDir:30,lat:39.0517,lon:-94.4803,roof:false,elev:750},
  LAA:{name:'Angel Stadium',cfDir:20,lat:33.8003,lon:-117.8827,roof:false,elev:158},
  LAD:{name:'Dodger Stadium',cfDir:25,lat:34.0739,lon:-118.24,roof:false,elev:512},
  MIA:{name:'LoanDepot Park',cfDir:10,lat:25.7781,lon:-80.2197,roof:true,elev:6},
  MIL:{name:'American Family Field',cfDir:15,lat:43.028,lon:-87.9712,roof:true,elev:635},
  MIN:{name:'Target Field',cfDir:355,lat:44.9817,lon:-93.2781,roof:false,elev:841},
  NYM:{name:'Citi Field',cfDir:15,lat:40.7571,lon:-73.8458,roof:false,elev:20},
  NYY:{name:'Yankee Stadium',cfDir:20,lat:40.8296,lon:-73.9262,roof:false,elev:55},
  ATH:{name:'Sutter Health Park',cfDir:30,lat:38.5802,lon:-121.5085,roof:false,elev:25},
  PHI:{name:'Citizens Bank Park',cfDir:10,lat:39.9061,lon:-75.1665,roof:false,elev:20},
  PIT:{name:'PNC Park',cfDir:355,lat:40.4469,lon:-80.0057,roof:false,elev:730},
  SD:{name:'Petco Park',cfDir:310,lat:32.7073,lon:-117.1566,roof:false,elev:20},
  SF:{name:'Oracle Park',cfDir:90,lat:37.7786,lon:-122.3893,roof:false,elev:10},
  SEA:{name:'T-Mobile Park',cfDir:5,lat:47.5914,lon:-122.3325,roof:true,elev:175},
  STL:{name:'Busch Stadium',cfDir:10,lat:38.6226,lon:-90.1928,roof:false,elev:455},
  TB:{name:'Tropicana Field',cfDir:20,lat:27.7683,lon:-82.6534,roof:true,elev:15},
  TEX:{name:'Globe Life Field',cfDir:25,lat:32.7473,lon:-97.0825,roof:true,elev:551},
  TOR:{name:'Rogers Centre',cfDir:10,lat:43.6414,lon:-79.3894,roof:true,elev:251},
  WSH:{name:'Nationals Park',cfDir:5,lat:38.873,lon:-77.0074,roof:false,elev:25}
};

var T2P={ATL:'ATL',ARI:'ARI',AZ:'ARI',BAL:'BAL',BOS:'BOS',CHC:'CHC',CWS:'CWS',CIN:'CIN',
         CLE:'CLE',COL:'COL',DET:'DET',HOU:'HOU',KC:'KC',KCR:'KC',LAA:'LAA',LAD:'LAD',
         MIA:'MIA',MIL:'MIL',MIN:'MIN',NYM:'NYM',NYY:'NYY',OAK:'ATH',ATH:'ATH',PHI:'PHI',
         PIT:'PIT',SD:'SD',SDP:'SD',SF:'SF',SFG:'SF',SEA:'SEA',STL:'STL',TB:'TB',TBR:'TB',
         TEX:'TEX',TOR:'TOR',WSH:'WSH',WAS:'WSH'};

var COMPASS={N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,
             S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};

// ── GLOBALS ──────────────────────────────────────────────────────────────────
var allData=[], expandedKey=null, lastUpdated='', nextRef=Date.now()+REFRESH_MS;
var splitMaps={}, pitcherMap={}, wxCache={};

// ── HELPERS ───────────────────────────────────────────────────────────────────
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nv(v){var x=parseFloat(v);return isNaN(x)?null:x;}
function fmt(v,d){return v!=null?v.toFixed(d):'—';}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function hs(h){return h==='L'?'←':h==='S'?'↔':'→';}
function gtime(iso){if(!iso)return '';try{return new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
function splLabel(k){if(k==='overall')return 'Overall';var b={L:'LHB',R:'RHB'}[k[0]]||k[0],p={L:'LHP',R:'RHP'}[k[2]]||k[2];return b+' vs '+p;}
function pickSplit(bh,sh){var b=bh;if(b==='S')b=sh==='R'?'L':'R';if(!b||!sh)return 'overall';return b+'v'+sh;}

function sc(s){if(s>=75)return'#dc2626';if(s>=60)return'#d97706';if(s>=45)return'#b45309';if(s>=30)return'#16a34a';return'#15803d';}
function stc(v,k){
  var t={barrel:[4,7,11,15],ev:[87,89,91,93],hh:[32,38,44,50],xslg:[.33,.39,.45,.52],xwoba:[.28,.31,.34,.37],hr:[3,7,12,18]}[k];
  if(!t||v==null)return'#64748b';
  if(v>=t[3])return'#dc2626';if(v>=t[2])return'#d97706';if(v>=t[1])return'#b45309';if(v>=t[0])return'#16a34a';return'#64748b';
}
function pfc(p){if(p>108)return'#d97706';if(p>103)return'#b45309';if(p<93)return'#2563eb';if(p<97)return'#64748b';return'#64748b';}
function tc(t){if(!t||t==='—')return'#64748b';var d=parseInt(t);if(d>85)return'#dc2626';if(d<50)return'#2563eb';return'#64748b';}

// ── CSV PARSING ───────────────────────────────────────────────────────────────
function parseCSV(text){
  var lines=text.trim().split('\n').filter(function(l){return l.trim();});
  if(lines.length<2)return [];
  var headers=lines[0].split(',').map(function(h){return h.trim().replace(/"/g,'');});
  var sample=lines[1].split(',');
  if(sample.length===headers.length+1) headers=['player_name'].concat(headers);
  var statCols=['xba','xslg','xwoba','xobp','exit_velocity_avg','launch_angle_avg','sweet_spot_percent','barrel_batted_rate','hard_hit_percent','avg_best_speed','home_run','pa'];
  var fixed=[];
  for(var i=1;i<lines.length;i++){
    var line=lines[i]; if(!line.trim())continue;
    var vals=[],cur='',q=false;
    for(var j=0;j<line.length;j++){
      var c=line[j];
      if(c==='"')q=!q;
      else if(c===','&&!q){vals.push(cur.trim().replace(/"/g,''));cur='';}
      else cur+=c;
    }
    vals.push(cur.trim().replace(/"/g,''));
    if(vals.length<3)continue;
    var full=vals[0],pid=vals[1],sv=vals.slice(3);
    var last,first;
    if(full.indexOf(',')>=0){var p=full.split(',',2);last=p[0].trim();first=p[1].trim();}
    else{last=full.trim();first='';}
    var row={last_name:last,first_name:first,player_id:pid};
    statCols.forEach(function(col,idx){row[col]=sv[idx]||'';});
    fixed.push(row);
  }
  return fixed;
}

function buildLookup(rows){
  var byId={},byLast={},byFull={};
  rows.forEach(function(r){
    var st={barrel:nv(r.barrel_batted_rate),ev:nv(r.exit_velocity_avg),hh:nv(r.hard_hit_percent),
            xslg:nv(r.xslg),xwoba:nv(r.xwoba),xba:nv(r.xba),hr:nv(r.home_run),pa:nv(r.pa)};
    var pid=(r.player_id||'').trim();
    try{var pi=parseInt(parseFloat(pid));if(pi>10000)byId[String(pi)]=st;}catch(e){}
    var la=(r.last_name||'').toLowerCase().trim();
    var fi=(r.first_name||'').toLowerCase().trim();
    if(la&&fi){byLast[la+'_'+fi]=st;if(!byLast[la])byLast[la]=st;byFull[fi+' '+la]=st;}
  });
  return {byId:byId,byLast:byLast,byFull:byFull};
}

function lookup(m,batter){
  if(!m)return null;
  var hit=m.byId[String(batter.id)];if(hit)return hit;
  var parts=(batter.name||'').trim().split(' ');
  if(parts.length>=2){
    var fi=parts[0].toLowerCase();
    var la=parts.slice(1).join(' ').toLowerCase().replace(/\s+(jr|sr|ii|iii)\.?$/i,'').trim();
    return m.byLast[la+'_'+fi]||m.byFull[fi+' '+la]||m.byLast[la]||null;
  }
  return null;
}

// ── SAVANT FETCH ──────────────────────────────────────────────────────────────
function savantUrl(batSide,pThrows,type){
  var bs=batSide?'&bat_side='+batSide:'';
  var pt=pThrows?'&p_throws='+pThrows:'';
  var tp=type||'batter';
  return 'https://baseballsavant.mlb.com/leaderboard/custom?year='+YEAR+'&type='+tp+'&filter=&min=10'
    +'&selections=xba,xslg,xwoba,xobp,exit_velocity_avg,launch_angle_avg,sweet_spot_percent,barrel_batted_rate,hard_hit_percent,avg_best_speed,home_run,pa'
    +'&chart=false&x=xslg&y=xslg&r=no&chartType=beeswarm'+bs+pt+'&csv=true';
}

function fetchCSV(url){
  return fetch(PROXY+encodeURIComponent(url))
    .then(function(r){return r.json();})
    .then(function(d){return parseCSV(d.contents||'');});
}

// ── WIND ──────────────────────────────────────────────────────────────────────
function parseWindSpd(ws){if(!ws)return 0;var n=(ws.match(/\d+/g)||[]);return n.length>=2?(+n[0]+ +n[1])/2:n.length?+n[0]:0;}
function windEffect(fromDeg,spd,cfDir,roof){
  if(roof)return{label:'Dome',score:0,color:'#475569',short:'🏟️ Dome'};
  if(spd<3)return{label:'Calm',score:0,color:'#64748b',short:'🌫️ Calm'};
  var toCF=(fromDeg+180)%360,diff=Math.abs(toCF-cfDir);
  if(diff>180)diff=360-diff;
  var f=Math.cos(diff*Math.PI/180),s=f*spd;
  if(diff<=30)return{label:'Blowing OUT to CF',score:s,color:'#dc2626',short:'💨 OUT '+spd.toFixed(0)+'mph'};
  if(diff<=60)return{label:'Out to corner',score:s*.7,color:'#d97706',short:'↗️ Out '+spd.toFixed(0)+'mph'};
  if(diff<=120)return{label:'Crosswind',score:s*.1,color:'#b45309',short:'↔️ Cross '+spd.toFixed(0)+'mph'};
  if(diff<=150)return{label:'Partial headwind',score:s,color:'#2563eb',short:'↙️ '+spd.toFixed(0)+'mph in'};
  return{label:'Blowing IN',score:s,color:'#1d4ed8',short:'🌬️ IN '+spd.toFixed(0)+'mph'};
}

function fetchWeather(parkKey){
  if(wxCache[parkKey])return Promise.resolve(wxCache[parkKey]);
  var p=PARKS[parkKey];if(!p)return Promise.resolve(null);
  return fetch('https://api.weather.gov/points/'+p.lat+','+p.lon)
    .then(function(r){return r.json();})
    .then(function(d){return fetch(d.properties.forecastHourly);})
    .then(function(r){return r.json();})
    .then(function(d){
      var now=d.properties.periods[0];
      var spd=parseWindSpd(now.windSpeed);
      var deg=COMPASS[now.windDirection.toUpperCase()]||0;
      var wi=windEffect(deg,spd,p.cfDir,p.roof);
      var res={temp:now.temperature,unit:now.temperatureUnit,wind:now.windSpeed,windDir:now.windDirection,forecast:now.shortForecast,wi:wi};
      wxCache[parkKey]=res;return res;
    }).catch(function(){return null;});
}

// ── SCORING ───────────────────────────────────────────────────────────────────
function pitcherVuln(pc){
  if(!pc)return 1.0;
  var b=pc.barrel||PITCHER_AVG.barrel,h=pc.hh||PITCHER_AVG.hh,x=pc.xslg||PITCHER_AVG.xslg;
  var v=x/PITCHER_AVG.xslg*.5+b/PITCHER_AVG.barrel*.3+h/PITCHER_AVG.hh*.2;
  return Math.max(.70,Math.min(1.40,v));
}
function calcScore(sc,pfVal,wi,park,pc){
  if(!sc)return null;
  var base=(sc.xslg||0)*28+(sc.barrel||0)*2.0+(sc.hh||0)*.35;
  var pm=(pfVal||100)/100,v=pitcherVuln(pc);
  var wb=park.roof?0:(wi?wi.score:0)*.6;
  var eb=park.roof?0:(park.elev/1000)*2;
  return Math.min(99,Math.max(1,base*pm*v+wb+eb));
}
function breakdown(sc,pfVal,wi,park,pc){
  if(!sc)return null;
  var pm=(pfVal||100)/100,v=pitcherVuln(pc);
  var xp=+((sc.xslg||0)*28*pm*v).toFixed(1);
  var bp=+((sc.barrel||0)*2.0*pm*v).toFixed(1);
  var hp=+((sc.hh||0)*.35*pm*v).toFixed(1);
  var wp=park.roof?0:+((wi?wi.score:0)*.6).toFixed(1);
  var ep=park.roof?0:+((park.elev/1000)*2).toFixed(1);
  var pp=+((v-1.0)*15).toFixed(1);
  return{xp:xp,bp:bp,hp:hp,wp:wp,ep:ep,pp:pp,pv:v};
}

function loadAll(){
  setLoading(true);
  document.getElementById('prog').style.display='flex';
  document.getElementById('tbl').style.display='none';
  document.getElementById('nolines').style.display='none';
  document.getElementById('sbar').style.display='none';
  setMsg('Loading Statcast splits...');

  // Load scoreboard in parallel (doesn't block main data)
  loadScoreboard();

  // Load all 5 batter splits + pitcher in parallel
  var splitDefs=[['LvR','L','R'],['RvL','R','L'],['RvR','R','R'],['LvL','L','L'],['overall','','']];
  var promises=splitDefs.map(function(d){
    return fetchCSV(savantUrl(d[1],d[2],'batter')).then(function(rows){return{key:d[0],map:buildLookup(rows)};});
  });
  var pitcherPromise=fetchCSV(savantUrl('','','pitcher')).then(function(rows){return buildLookup(rows);});

  Promise.all(promises).then(function(results){
    results.forEach(function(r){splitMaps[r.key]=r.map;});
    return pitcherPromise;
  }).then(function(pm){
    pitcherMap=pm;
    setMsg('Loading schedule...');
    return fetch(MLB+'/schedule?sportId=1&date='+today()+'&hydrate=team');
  }).then(function(r){return r.json();})
  .then(function(sd){
    var games=[];
    (sd.dates||[]).forEach(function(d){
      (d.games||[]).forEach(function(g){
        games.push({game_pk:g.gamePk,status:g.status&&g.status.detailedState||'',
          time:g.gameDate||'',
          home_abbrev:g.teams.home.team.abbreviation,
          away_abbrev:g.teams.away.team.abbreviation});
      });
    });
    setMsg('Checking lineups for '+games.length+' games...');
    var LIVE=['In Progress','Final','Game Over','Completed','Completed Early'];
    var lineupPromises=games.map(function(g){
      if(LIVE.indexOf(g.status)>=0)return Promise.resolve(null);
      return fetch('https://statsapi.mlb.com/api/v1.1/game/'+g.game_pk+'/feed/live')
        .then(function(r){return r.json();})
        .then(function(feed){
          var bt=feed.liveData&&feed.liveData.boxscore&&feed.liveData.boxscore.teams||{};
          var fp=feed.gameData&&feed.gameData.players||{};
          function parseBat(tb){
            var out=[];
            (tb.battingOrder||[]).forEach(function(pid,i){
              var ps=String(parseInt(parseFloat(String(pid))));
              var key='ID'+ps;
              var bp=(tb.players&&(tb.players[key]||tb.players[ps]))||{};
              var gp=fp[key]||{};
              var bpn=bp.person||{};
              out.push({id:parseInt(ps),slot:i+1,
                name:bpn.fullName||gp.fullName||'',
                hand:(bpn.batSide&&bpn.batSide.code)||(gp.batSide&&gp.batSide.code)||'',
                pos:(bp.position&&bp.position.abbreviation)||''});
            });
            return out;
          }
          var hb=parseBat(bt.home||{}),ab=parseBat(bt.away||{});
          if(!hb.length&&!ab.length)return null;
          var pp=feed.gameData&&feed.gameData.probablePitchers||{};
          function spo(pe){return pe?{id:pe.id,name:pe.fullName,hand:(pe.pitchHand&&pe.pitchHand.code)||''}:null;}
          return{game:g,hb:hb,ab:ab,home_sp:spo(pp.home),away_sp:spo(pp.away)};
        }).catch(function(){return null;});
    });
    return Promise.all(lineupPromises);
  }).then(function(lineups){
    var confirmed=lineups.filter(Boolean);
    if(!confirmed.length){
      setLoading(false);
      document.getElementById('prog').style.display='none';
      document.getElementById('nolines').style.display='flex';
      return;
    }
    // Fill missing SP hands
    var spFills=[];
    confirmed.forEach(function(lu){
      ['home_sp','away_sp'].forEach(function(k){
        var sp=lu[k];
        if(sp&&!sp.hand){
          spFills.push(fetch(MLB+'/people/'+sp.id).then(function(r){return r.json();}).then(function(d){
            sp.hand=(d.people&&d.people[0]&&d.people[0].pitchHand&&d.people[0].pitchHand.code)||'';
          }).catch(function(){}));
        }
      });
    });
    setMsg('Fetching weather...');
    var parkKeys=[...new Set(confirmed.map(function(lu){return T2P[lu.game.home_abbrev];}).filter(Boolean))];
    var wxPromises=parkKeys.map(function(pk){return fetchWeather(pk);});
    return Promise.all(spFills.concat(wxPromises)).then(function(){return confirmed;});
  }).then(function(confirmed){
    if(!confirmed)return;
    setMsg('Building rankings...');
    var rows=[];
    confirmed.forEach(function(lu){
      var g=lu.game,pk=T2P[g.home_abbrev];
      var park=Object.assign({},PARKS[pk]||{elev:0,roof:false,cfDir:0,name:'Unknown'},{abbrev:pk||''});
      var wx=wxCache[pk]||null,wi=wx?wx.wi:null,pfVal=PF[pk]||100;
      function add(batters,sp,batFor,batAgainst){
        var pc=sp?lookup(pitcherMap,sp):null;
        batters.forEach(function(b){
          var key=pickSplit(b.hand,sp?sp.hand:'');
          var sc2=lookup(splitMaps[key],b)||lookup(splitMaps.overall,b);
          if(!sc2)return;
          var used=(lookup(splitMaps[key],b)&&key!=='overall')?key:'overall';
          var s=calcScore(sc2,pfVal,wi,park,pc);if(s==null)return;
          var bd=breakdown(sc2,pfVal,wi,park,pc);
          rows.push({
            name:b.name,slot:b.slot,hand:b.hand,pos:b.pos,
            team:batFor,vs_team:batAgainst,
            sp_name:sp?sp.name:'TBD',sp_hand:sp?sp.hand:'',
            score:s,split:used,
            xslg:sc2.xslg,barrel:sc2.barrel,hh:sc2.hh,ev:sc2.ev,xwoba:sc2.xwoba,hr:sc2.hr,pa:sc2.pa,
            p_barrel:pc?pc.barrel:null,p_hh:pc?pc.hh:null,p_xslg:pc?pc.xslg:null,
            p_xwoba:pc?pc.xwoba:null,p_ev:pc?pc.ev:null,p_vuln:pitcherVuln(pc),
            park_name:park.name,pf:pfVal,
            wind_short:wi?wi.short:(park.roof?'🏟️ Dome':'—'),
            wind_label:wi?wi.label:(park.roof?'Dome':'—'),
            wind_color:wi?wi.color:'#475569',
            temp:wx?wx.temp+'°'+wx.unit:'—',
            forecast:wx?wx.forecast:'',
            low_pa:sc2.pa!=null&&sc2.pa<LOW_PA,
            bd:bd,game_time:g.time,
          });
        });
      }
      add(lu.ab,lu.home_sp,g.away_abbrev,g.home_abbrev);
      add(lu.hb,lu.away_sp,g.home_abbrev,g.away_abbrev);
    });
    rows.sort(function(a,b){return b.score-a.score;});
    allData=rows;
    renderData(rows,confirmed.length);
    setLoading(false);
    lastUpdated=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});
    document.getElementById('upd').textContent='Updated '+lastUpdated;
    nextRef=Date.now()+REFRESH_MS;
  }).catch(function(e){
    setLoading(false);
    setMsg('Error loading data. Check console.');
    console.error(e);
  });
}

// ── EXPAND PANEL ─────────────────────────────────────────────────────────────
function buildExp(r,col){
  var bd=r.bd||{};
  var pvp=r.p_vuln!=null?Math.round((r.p_vuln-1.0)*100):null;
  var pvc=pvp==null?'#64748b':pvp>15?'#dc2626':pvp>5?'#d97706':pvp<-15?'#2563eb':pvp<-5?'#3b82f6':'#64748b';
  var pvv=pvp==null?'No pitcher data':pvp>15?'Very Hittable':pvp>5?'Hittable':pvp<-15?'Very Tough':pvp<-5?'Tough':'League Average';
  var pvi=pvp==null?'—':pvp>15?'🔴':pvp>5?'🟠':pvp<-15?'🔵':pvp<-5?'🟦':'⚪';
  var bars=[['xSLG × park × pitcher',bd.xp,'#0077cc'],['Barrel% × park × pitcher',bd.bp,'#dc2626'],
            ['HardHit% × park × pitcher',bd.hp,'#d97706'],['Pitcher vuln adj',bd.pp||0,pvc],
            ['Wind bonus',bd.wp,r.wind_color||'#64748b'],['Elevation bonus',bd.ep,'#7c3aed']];
  var barsH=bars.map(function(x){
    var val=x[1]||0,color=x[2];
    return '<div class="bdr"><span class="bdl">'+x[0]+'</span><div class="bdbw">'
      +'<div class="bdb" style="width:'+Math.max(2,Math.min(60,Math.abs(val)*1.4))+'px;background:'+color+'"></div>'
      +'<span class="bdv" style="color:'+(val>=0?color:'#3b82f6')+'">'+(val>=0?'+':'')+val.toFixed(1)+'</span></div></div>';
  }).join('');
  var bstats=[['xSLG',fmt(r.xslg,3),'xslg',r.xslg],['Barrel%',r.barrel!=null?r.barrel.toFixed(1)+'%':'—','barrel',r.barrel],
              ['HardHit%',r.hh!=null?r.hh.toFixed(1)+'%':'—','hh',r.hh],['Avg EV',r.ev!=null?r.ev.toFixed(1)+' mph':'—','ev',r.ev],
              ['xwOBA',fmt(r.xwoba,3),'xwoba',r.xwoba],['HRs',r.hr!=null?r.hr.toFixed(0):'—','hr',r.hr],['PA (split)',r.pa!=null?r.pa.toFixed(0):'—',null,null]];
  var bstH=bstats.map(function(x){return '<div class="st"><div class="stl">'+x[0]+'</div><div class="stv" style="color:'+(x[2]?stc(x[3],x[2]):'#64748b')+'">'+x[1]+'</div></div>';}).join('');
  var pstats=[['xSLG allowed',fmt(r.p_xslg,3),'xslg',r.p_xslg],['Barrel% allowed',r.p_barrel!=null?r.p_barrel.toFixed(1)+'%':'—','barrel',r.p_barrel],
              ['HardHit% allowed',r.p_hh!=null?r.p_hh.toFixed(1)+'%':'—','hh',r.p_hh],['EV allowed',r.p_ev!=null?r.p_ev.toFixed(1)+' mph':'—','ev',r.p_ev],
              ['xwOBA allowed',fmt(r.p_xwoba,3),'xwoba',r.p_xwoba]];
  var pstH=pstats.map(function(x){return '<div class="st"><div class="stl">'+x[0]+'</div><div class="stv" style="color:'+(x[2]?stc(x[3],x[2]):'#64748b')+'">'+x[1]+'</div></div>';}).join('');
  var pfd=r.pf>105?'▲ HR-friendly':r.pf<95?'▼ Suppressing':'≈ Neutral';
  var env=[['Venue',r.park_name,'#4a6278'],['HR Park Factor',r.pf+' '+pfd,pfc(r.pf)],
           ['Temp',r.temp,tc(r.temp)],['Wind',r.wind_label,r.wind_color||'#64748b'],['Sky',r.forecast||'—','#64748b']];
  var envH=env.map(function(x){return '<div class="er"><span class="el">'+x[0]+'</span><span class="ev2" style="color:'+x[2]+'">'+x[1]+'</span></div>';}).join('');
  return '<div class="egrid">'
    +'<div class="ec"><div class="ect">⚡ Score Breakdown</div>'+barsH
    +'<div class="btot"><span class="btotl">Total HR⚡</span><span class="btotv">'+Math.round(r.score)+'</span></div>'
    +'<div class="spu"><div class="spul">Batter stats</div><div class="spuv">'+splLabel(r.split)+(r.low_pa?' · ⚠ '+r.pa+' PA':'')+'</div></div>'
    +'<div class="sbar2"><div class="sbf" style="width:'+r.score+'%"></div></div></div>'
    +'<div class="ec"><div class="ect">🧢 Batter — '+splLabel(r.split)+'</div><div class="sgrid">'+bstH+'</div></div>'
    +'<div class="ec"><div class="ect">⚾ Pitcher — '+r.sp_name+'</div>'
    +'<div class="pvbox"><div class="pvicon">'+pvi+'</div><div><div class="pvv" style="color:'+pvc+'">'+pvv+'</div>'
    +'<div class="pvs">'+(pvp!=null?(pvp>0?'+':'')+pvp+'% vs league avg':'No Statcast data')+'</div></div></div>'
    +'<div class="sgrid">'+pstH+'</div></div>'
    +'<div class="ec"><div class="ect">🏟️ Park + Weather</div>'+envH+'</div>'
    +'</div>';
}

function toggle(key,r,col,rowEl){
  var eid='exp_'+key.replace(/[^a-z0-9]/gi,'_');
  var expEl=document.getElementById(eid);
  var wasOpen=expandedKey===key;
  expandedKey=wasOpen?null:key;
  document.querySelectorAll('.row.open').forEach(function(el){el.classList.remove('open');});
  document.querySelectorAll('.exp.open').forEach(function(el){el.classList.remove('open');el.innerHTML='';});
  if(!wasOpen&&expEl){rowEl.classList.add('open');expEl.innerHTML=buildExp(r,col);expEl.classList.add('open');}
}

function doSearch(q){
  var v=q.toLowerCase().trim();
  var c=document.getElementById('rows');
  var kids=Array.from(c.children);
  var vis=0,i=0;
  while(i<kids.length){
    var re=kids[i],xe=kids[i+1];i+=2;
    if(!re||!re.classList.contains('row')){i--;continue;}
    var match=!v||re.dataset.sk.includes(v);
    re.style.display=match?'':'none';
    if(xe&&xe.classList.contains('exp'))xe.style.display=match?'':'none';
    if(match){vis++;var rk=re.querySelector('div');if(rk)rk.textContent=vis;}
  }
  var ct=document.getElementById('srchct');
  if(ct)ct.textContent=v?(vis+' result'+(vis!==1?'s':'')):'';
}
