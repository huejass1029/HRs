<script>
const {useState,useEffect,useRef} = React;
const html = htm.bind(React.createElement);

// ── PARKS ─────────────────────────────────────────────────────────────────

const T2P={
  ATL:"ATL",ARI:"ARI",AZ:"ARI",BAL:"BAL",BOS:"BOS",CHC:"CHC",CWS:"CWS",CIN:"CIN",
  CLE:"CLE",COL:"COL",DET:"DET",HOU:"HOU",KC:"KC",KCR:"KC",LAA:"LAA",LAD:"LAD",
  MIA:"MIA",MIL:"MIL",MIN:"MIN",NYM:"NYM",NYY:"NYY",OAK:"ATH",ATH:"ATH",
  PHI:"PHI",PIT:"PIT",SD:"SD",SDP:"SD",SF:"SF",SFG:"SF",SEA:"SEA",STL:"STL",
  TB:"TB",TBR:"TB",TEX:"TEX",TOR:"TOR",WSH:"WSH",WAS:"WSH"
};

// ── SAVANT URLS ────────────────────────────────────────────────────────────
// Four platoon split leaderboards + overall fallback + park factors
const PROXY="https://corsproxy.io/?";
const YEAR="2026";

function scUrl(batSide,pThrows){
  // batSide: L|R|"", pThrows: L|R|""
  const bs=batSide?`&bat_side=${batSide}`:"";
  const pt=pThrows?`&p_throws=${pThrows}`:"";
  return PROXY+encodeURIComponent(
    `https://baseballsavant.mlb.com/leaderboard/statcast?type=batter&year=${YEAR}&position=&team=&min=5&sort=barrel_batted_rate&sortDir=desc${bs}${pt}&csv=true`
  );
}

const PF_URL=PROXY+encodeURIComponent(
  `https://baseballsavant.mlb.com/leaderboard/statcast-park-factors?type=year&year=${YEAR}&batSide=&stat=index_HR&csv=true`
);
const MLB="https://statsapi.mlb.com/api/v1";

// ── HELPERS ────────────────────────────────────────────────────────────────
function parseCSV(text){
  const lines=text.trim().split("\n");
  if(lines.length<2) return [];
  const hdr=lines[0].split(",").map(h=>h.trim().replace(/"/g,""));
  return lines.slice(1).map(line=>{
    const vals=[];let cur="";let q=false;
    for(const c of line){if(c==='"')q=!q;else if(c===','&&!q){vals.push(cur);cur="";}else cur+=c;}
    vals.push(cur);
    const o={};hdr.forEach((h,i)=>{o[h]=vals[i]?.trim().replace(/"/g,"")||"";});return o;
  });
}

const nv=v=>{const x=parseFloat(v);return isNaN(x)?null:x;};

// Build a lookup map from a parsed CSV array
function buildLookup(rows){
  const byId={},byLast={},byFull={};
  rows.forEach(r=>{
    const st={
      barrel:nv(r.barrel_batted_rate),ev:nv(r.exit_velocity_avg),
      hh:nv(r.hard_hit_percent),xslg:nv(r.xslg),xwoba:nv(r.xwoba),
      xba:nv(r.xba),hr:nv(r.home_run)??nv(r.hrs),
      pa:nv(r.pa),la:nv(r.launch_angle_avg),ss:nv(r.sweet_spot_percent)
    };
    if(r.player_id) byId[String(r.player_id)]=st;
    const last=(r.last_name||"").toLowerCase().trim();
    const first=(r.first_name||"").toLowerCase().trim();
    if(last&&first){
      byLast[`${last}_${first}`]=st;
      if(!byLast[last]) byLast[last]=st;
      byFull[`${first} ${last}`]=st;
    }
  });
  return {byId,byLast,byFull};
}

function lookupInMap(map,batter){
  const byId=map.byId[String(batter.id)];
  if(byId) return byId;
  const parts=(batter.name||"").trim().split(" ");
  if(parts.length>=2){
    const first=parts[0].toLowerCase();
    const last=parts.slice(1).join(" ").toLowerCase().replace(/\s+(jr|sr|ii|iii)\.?$/i,"").trim();
    return map.byLast[`${last}_${first}`]||map.byFull[`${first} ${last}`]||map.byLast[last]||null;
  }
  return null;
}

// Pick the right split map given batter hand and SP throwing hand
// Switch hitters bat opposite to pitcher — vs RHP they bat LH, vs LHP they bat RH
function pickSplitKey(batterHand,spHand){
  let bats=batterHand;
  if(bats==="S") bats=spHand==="R"?"L":"R"; // switch hitter bats opposite
  if(!bats||!spHand) return "overall";
  return `${bats}v${spHand}`; // e.g. "LvR", "RvL", "RvR", "LvL"
}

function today(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function ordSfx(n){
  const s=["th","st","nd","rd"],v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

function c2deg(d){
  return {N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,
          S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5}[d?.toUpperCase()]??0;
}

function pWindSpd(ws){
  if(!ws) return 0;
  const m=ws.match(/(\d+)/g);
  if(!m) return 0;
  return m.length>=2?(+m[0]+ +m[1])/2:+m[0];
}

function windFx(fromDeg,spd,cfDir,roof){
  if(roof) return {label:"Dome",score:0,color:"#475569",detail:"Climate controlled",short:"🏟️ Dome"};
  if(spd<3) return {label:"Calm",score:0,color:"#64748b",detail:`${spd.toFixed(0)} mph`,short:"🌫️ Calm"};
  const toCF=(fromDeg+180)%360;
  let diff=Math.abs(toCF-cfDir);if(diff>180)diff=360-diff;
  const factor=Math.cos((diff*Math.PI)/180);
  const score=factor*spd;
  if(diff<=30)  return {label:"Blowing OUT to CF",score,color:"#ef4444",detail:`${spd.toFixed(0)} mph out to CF`,short:`💨 OUT ${spd.toFixed(0)}mph`};
  if(diff<=60)  return {label:"Out to corner",score:score*.7,color:"#f97316",detail:`${spd.toFixed(0)} mph angled out`,short:`↗️ Out ${spd.toFixed(0)}mph`};
  if(diff<=120) return {label:"Crosswind",score:score*.1,color:"#eab308",detail:`${spd.toFixed(0)} mph crosswind`,short:`↔️ Cross ${spd.toFixed(0)}mph`};
  if(diff<=150) return {label:"Partial headwind",score,color:"#60a5fa",detail:`${spd.toFixed(0)} mph partial in`,short:`↙️ ${spd.toFixed(0)}mph in`};
  return {label:"Blowing IN",score,color:"#38bdf8",detail:`${spd.toFixed(0)} mph blowing in`,short:`🌬️ IN ${spd.toFixed(0)}mph`};
}

// ── SCORE FORMULA ──────────────────────────────────────────────────────────
// Primary driver: xSLG (already an expected value stat — best HR predictor)
// Secondary: Barrel% (confirms elite contact quality)
// Tertiary: HardHit% (broad power indicator)
// Environment: Park Factor × elevation × wind
// Weights chosen so a league-avg player (xSLG ~.400, Brl ~7%, HH ~37%) scores ~40
// and elite (xSLG .560, Brl 16%, HH 55%) scores ~85 before park/weather
function calcScore(sc,pf,wi,park){
  if(!sc) return null;
  const xslgPts  = (sc.xslg||0) * 28;   // primary — range ~9 to ~16pts raw
  const barrelPts= (sc.barrel||0) * 2.0; // secondary
  const hhPts    = (sc.hh||0) * 0.35;    // tertiary
  const base = xslgPts + barrelPts + hhPts;
  const pm   = (pf||100)/100;
  const wb   = park.roof?0:(wi?.score||0)*0.6;
  const eb   = park.roof?0:(park.elev/1000)*2;
  return Math.min(99,Math.max(1,base*pm+wb+eb)).toFixed(0);
}

function breakdown(sc,pf,wi,park){
  if(!sc) return null;
  const pm=(pf||100)/100;
  const xp  = +((sc.xslg||0)*28*pm).toFixed(1);
  const bp  = +((sc.barrel||0)*2.0*pm).toFixed(1);
  const hp  = +((sc.hh||0)*.35*pm).toFixed(1);
  const wp  = park.roof?0:+((wi?.score||0)*.6).toFixed(1);
  const ep  = park.roof?0:+((park.elev/1000)*2).toFixed(1);
  const total=+Math.min(99,Math.max(1,xp+bp+hp+wp+ep)).toFixed(0);
  return {xp,bp,hp,wp,ep,total};
}

function sColor(s){
  const v=+s;
  if(v>=75) return "#ef4444";
  if(v>=60) return "#f97316";
  if(v>=45) return "#eab308";
  if(v>=30) return "#84cc16";
  return "#22c55e";
}

function stColor(v,k){
  const t={barrel:[4,7,11,15],ev:[87,89,91,93],hh:[32,38,44,50],
           xslg:[.33,.39,.45,.52],xwoba:[.28,.31,.34,.37],hr:[3,7,12,18]}[k];
  if(!t||v===null) return "#475569";
  if(v>=t[3]) return "#ef4444";
  if(v>=t[2]) return "#f97316";
  if(v>=t[1]) return "#eab308";
  if(v>=t[0]) return "#84cc16";
  return "#64748b";
}

// Low PA warning threshold for platoon splits
const LOW_PA = 40;

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  const [phase,setPhase]   = useState("loading");
  const [msg,setMsg]       = useState("Loading Statcast data...");
  const [rows,setRows]     = useState([]);
  const [exp,setExp]       = useState(null);
  const [updated,setUpdated] = useState(null);
  const [busy,setBusy]     = useState(false);
  const wCache = useRef({});
  // splitMaps: { "LvR":{byId,byLast,byFull}, "RvL":..., "RvR":..., "LvL":..., "overall":... }
  const splitMaps = useRef({});

  async function getWeather(park){
    const k=park.abbrev;
    if(wCache.current[k]) return wCache.current[k];
    try{
      const pr=await fetch(`https://api.weather.gov/points/${park.lat},${park.lon}`);
      const pd=await pr.json();
      const fu=pd?.properties?.forecastHourly;if(!fu) throw 0;
      const fr=await fetch(fu);
      const fd=await fr.json();
      const now=fd?.properties?.periods?.[0];if(!now) throw 0;
      const spd=pWindSpd(now.windSpeed);
      const deg=c2deg(now.windDirection);
      const wi=windFx(deg,spd,park.cfDir,park.roof);
      const res={temp:now.temperature,unit:now.temperatureUnit,windDir:now.windDirection,wind:now.windSpeed,forecast:now.shortForecast,wi};
      wCache.current[k]=res;return res;
    }catch(e){return null;}
  }

  async function load(){
    setPhase("loading");setMsg("Loading Statcast platoon splits...");
    let pfMap={};

    try{
      // Load all 5 leaderboards in parallel: 4 platoon splits + overall + park factors
      const [pfR,lvR_R,rvL_R,rvR_R,lvL_R,all_R]=await Promise.all([
        fetch(PF_URL),
        fetch(scUrl("L","R")),  // LHB vs RHP
        fetch(scUrl("R","L")),  // RHB vs LHP
        fetch(scUrl("R","R")),  // RHB vs RHP
        fetch(scUrl("L","L")),  // LHB vs LHP
        fetch(scUrl("","")),    // overall fallback
      ]);

      // Park factors
      parseCSV(await pfR.text()).forEach(r=>{
        const k=(r.team_abbrev||r.team||"").toUpperCase();
        if(k&&r.index_HR) pfMap[k]=nv(r.index_HR);
      });

      // Build split lookup maps
      splitMaps.current={
        "LvR": buildLookup(parseCSV(await lvR_R.text())),
        "RvL": buildLookup(parseCSV(await rvL_R.text())),
        "RvR": buildLookup(parseCSV(await rvR_R.text())),
        "LvL": buildLookup(parseCSV(await lvL_R.text())),
        "overall": buildLookup(parseCSV(await all_R.text())),
      };

    }catch(e){setPhase("error");setMsg("Failed to load Statcast data.");return;}

    setMsg("Loading schedule...");
    let games=[];
    try{
      const sr=await fetch(`${MLB}/schedule?sportId=1&date=${today()}&hydrate=team`);
      const sd=await sr.json();
      (sd.dates||[]).forEach(d=>(d.games||[]).forEach(g=>games.push({
        gamePk:g.gamePk,status:g.status?.detailedState||"",time:g.gameDate,
        homeAbbrev:g.teams?.home?.team?.abbreviation||"",
        awayAbbrev:g.teams?.away?.team?.abbreviation||"",
      })));
    }catch(e){setPhase("error");setMsg("Failed to load schedule.");return;}

    setMsg(`Checking lineups for ${games.length} games...`);

    const lineups=await Promise.all(games.map(async g=>{
      try{
        const [bR,fR]=await Promise.all([
          fetch(`${MLB}/game/${g.gamePk}/boxscore`),
          fetch(`${MLB}/game/${g.gamePk}/feed/live?fields=gameData,probablePitchers,players`)
        ]);
        const box=await bR.json();
        const feed=await fR.json();
        const hBox=box.teams?.home;
        const aBox=box.teams?.away;
        const parseBat=tb=>(tb?.battingOrder||[]).map((id,i)=>{
          const p=tb.players?.[`ID${id}`];
          return {
            id,slot:i+1,
            name:p?.person?.fullName||"",
            hand:p?.person?.batSide?.code||"",
            pos:p?.position?.abbreviation||""
          };
        });
        const hb=parseBat(hBox),ab=parseBat(aBox);
        if(!hb.length&&!ab.length) return null;

        // SP: get name AND pitchHand from probablePitchers
        const ph=feed.gameData?.probablePitchers?.home;
        const pa=feed.gameData?.probablePitchers?.away;

        // pitchHand may be on the person object directly or nested
        const spObj=(person)=>person?{
          id:person.id,
          name:person.fullName,
          hand:person.pitchHand?.code||""
        }:null;

        return {game:g,hb,ab,homeSP:spObj(ph),awaySP:spObj(pa)};
      }catch(e){return null;}
    }));

    // If pitchHand wasn't in the feed (sometimes it isn't), fetch it from /people
    const allSPs=[...lineups.filter(Boolean).flatMap(l=>[l.homeSP,l.awaySP].filter(sp=>sp&&!sp.hand))];
    if(allSPs.length){
      await Promise.all(allSPs.map(async sp=>{
        try{
          const r=await fetch(`${MLB}/people/${sp.id}?fields=people,pitchHand`);
          const d=await r.json();
          sp.hand=d?.people?.[0]?.pitchHand?.code||"";
        }catch(e){}
      }));
    }

    const confirmed=lineups.filter(Boolean);
    if(!confirmed.length){
      setPhase("ready");setRows([]);setUpdated(new Date().toLocaleTimeString());return;
    }

    setMsg("Fetching weather...");
    const parkKeys=[...new Set(confirmed.map(r=>T2P[r.game.homeAbbrev]).filter(Boolean))];
    await Promise.all(parkKeys.map(k=>getWeather(PARKS[k])));

    setMsg("Building rankings...");
    const out=[];

    confirmed.forEach(({game,hb,ab,homeSP,awaySP})=>{
      const pk=T2P[game.homeAbbrev];
      const park=PARKS[pk]||{elev:0,roof:false,abbrev:""};
      const wx=wCache.current[park.abbrev]||null;
      const wi=wx?.wi||null;
      const pf=pfMap[park.abbrev]||100;

      const addBatters=(batters,sp,batFor,batAgainst)=>{
        batters.forEach(b=>{
          // Pick the correct platoon split map
          const splitKey=pickSplitKey(b.hand,sp?.hand||"");
          const map=splitMaps.current[splitKey]||splitMaps.current["overall"];
          const sc=lookupInMap(map,b);

          // Fallback to overall if not found in split
          const scFinal=sc||lookupInMap(splitMaps.current["overall"],b);
          if(!scFinal) return;

          const usedSplit=(sc&&splitKey!=="overall")?splitKey:"overall";
          const score=+calcScore(scFinal,pf,wi,park);
          const bd=breakdown(scFinal,pf,wi,park);
          const lowSample=scFinal.pa!==null&&scFinal.pa<LOW_PA;

          out.push({
            key:`${game.gamePk}-${batFor}-${b.id}`,
            b,sc:scFinal,score,bd,sp,game,park,wx,wi,pf,
            batFor,batAgainst,splitKey:usedSplit,lowSample
          });
        });
      };

      addBatters(ab,homeSP,game.awayAbbrev,game.homeAbbrev);
      addBatters(hb,awaySP,game.homeAbbrev,game.awayAbbrev);
    });

    out.sort((a,b)=>b.score-a.score);
    setRows(out);
    setUpdated(new Date().toLocaleTimeString());
    setPhase("ready");setMsg("");
  }

  useEffect(()=>{load();},[]);

  async function onRefresh(){setBusy(true);wCache.current={};splitMaps.current={};await load();setBusy(false);}

  // ── RENDER ─────────────────────────────────────────────────────────────────
  if(phase==="loading") return html`
    <div style=${{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:14}}>
      <div class="spin" style=${{width:36,height:36,border:"2px solid #1a2740",borderTop:"2px solid #38bdf8",borderRadius:"50%"}}/>
      <div style=${{fontSize:10,color:"#334155",letterSpacing:"0.1em"}}>${msg}</div>
    </div>`;

  if(phase==="error") return html`
    <div style=${{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <div style=${{textAlign:"center"}}>
        <div style=${{fontSize:12,color:"#ef4444",marginBottom:12}}>${msg}</div>
        <button onClick=${()=>load()} style=${{background:"#0d1829",border:"1px solid #38bdf8",color:"#38bdf8",padding:"8px 16px",fontSize:10,borderRadius:5}}>Retry</button>
      </div>
    </div>`;

  // Split key label helper
  const splitLabel=k=>{
    if(k==="overall") return "Overall";
    const bMap={L:"LHB",R:"RHB"};
    const pMap={L:"LHP",R:"RHP"};
    const b=k[0],p=k[2];
    return `${bMap[b]||b} vs ${pMap[p]||p}`;
  };

  return html`<div style=${{minHeight:"100vh"}}>

    <!-- HEADER -->
    <div style=${{background:"linear-gradient(135deg,#0a1628 0%,#05080f 60%)",borderBottom:"1px solid #1a2740",padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
      <div>
        <div style=${{fontSize:17,fontWeight:700,color:"#f8fafc",letterSpacing:"-0.3px"}}>⚾ MLB HR Engine</div>
        <div style=${{fontSize:9,color:"#334155",marginTop:3,letterSpacing:"0.12em",textTransform:"uppercase"}}>
          Statcast Platoon Splits · Park Factors · Confirmed Lineups · Live Weather · ${today()}
        </div>
      </div>
      <div style=${{display:"flex",alignItems:"center",gap:10}}>
        ${updated&&html`<div style=${{fontSize:9,color:"#1e3a5f"}}>Updated ${updated}</div>`}
        <button onClick=${onRefresh} disabled=${busy}
          style=${{background:"#0d1829",border:"1px solid #38bdf8",color:"#38bdf8",padding:"6px 14px",fontSize:10,borderRadius:5,letterSpacing:"0.08em",opacity:busy?.6:1}}>
          ${busy?"⟳ Refreshing...":"⟳ Refresh"}
        </button>
      </div>
    </div>

    <!-- SUMMARY BAR -->
    <div style=${{background:"#080d18",borderBottom:"1px solid #1a2740",padding:"8px 20px",display:"flex",gap:14,alignItems:"center",flexWrap:"wrap"}}>
      <div style=${{fontSize:10,color:"#475569"}}>${rows.length} batters · sorted by HR score · platoon splits active</div>
      <div style=${{display:"flex",gap:10,flexWrap:"wrap"}}>
        ${[["#ef4444","75+ Elite"],["#f97316","60-74 High"],["#eab308","45-59 Mid"],["#84cc16","30-44 Low"],["#22c55e","<30"]].map(([c,l])=>html`
          <div style=${{display:"flex",alignItems:"center",gap:4}}>
            <div style=${{width:7,height:7,borderRadius:"50%",background:c}}/>
            <span style=${{fontSize:8,color:"#334155"}}>${l}</span>
          </div>`)}
      </div>
      ${rows.length===0&&html`<div style=${{fontSize:10,color:"#eab308"}} class="pulse">⏳ No confirmed lineups yet — check back closer to first pitch</div>`}
    </div>

    <!-- TABLE HEADER -->
    ${rows.length>0&&html`
    <div style=${{display:"flex",alignItems:"center",padding:"6px 16px",background:"#060c16",borderBottom:"1px solid #1a2740",gap:8,position:"sticky",top:0,zIndex:10}}>
      <div style=${{width:30,fontSize:8,color:"#1e3a5f",textTransform:"uppercase",letterSpacing:"0.1em"}}>#</div>
      <div style=${{width:38,fontSize:8,color:"#1e3a5f",textTransform:"uppercase",letterSpacing:"0.1em"}}>Score</div>
      <div style=${{flex:"1 1 130px",fontSize:8,color:"#1e3a5f",textTransform:"uppercase",letterSpacing:"0.1em"}}>Batter</div>
      <div style=${{width:36,fontSize:8,color:"#1e3a5f",textTransform:"uppercase",letterSpacing:"0.1em",textAlign:"center"}}>Slot</div>
      <div style=${{width:30,fontSize:8,color:"#1e3a5f",textTransform:"uppercase",letterSpacing:"0.1em",textAlign:"center"}}>Hand</div>
      <div style=${{flex:"1 1 110px",fontSize:8,color:"#1e3a5f",textTransform:"uppercase",letterSpacing:"0.1em"}}>vs SP</div>
      <div style=${{flex:"0 0 90px",fontSize:8,color:"#1e3a5f",textTransform:"uppercase",letterSpacing:"0.1em"}}>Park / PF</div>
      <div style=${{flex:"0 0 120px",fontSize:8,color:"#1e3a5f",textTransform:"uppercase",letterSpacing:"0.1em"}}>Wind</div>
      <div style=${{width:18}}/>
    </div>`}

    <!-- RANKED ROWS -->
    <div>
    ${rows.map((r,idx)=>{
      const open=exp===r.key;
      const sc=sColor(r.score);
      const spHandLabel=r.sp?.hand==="L"?"LHP":r.sp?.hand==="R"?"RHP":"";
      return html`<div key=${r.key}>

        <div class="rh" onClick=${()=>setExp(open?null:r.key)}
          style=${{display:"flex",alignItems:"center",padding:"9px 16px",gap:8,
            background:idx%2===0?"#070d18":"#060b16",
            borderBottom:"1px solid #0d1829",cursor:"pointer",
            borderLeft:`3px solid ${open?sc:"transparent"}`,
            transition:"border-color .15s"}}>

          <!-- Rank -->
          <div style=${{width:30,fontSize:10,color:"#1e3a5f",textAlign:"right",flexShrink:0}}>${idx+1}</div>

          <!-- Score -->
          <div style=${{width:38,height:32,borderRadius:5,background:sc+"1a",border:`1px solid ${sc}44`,
            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <span style=${{fontSize:15,fontWeight:700,color:sc,lineHeight:1}}>${r.score}</span>
          </div>

          <!-- Name + team -->
          <div style=${{flex:"1 1 130px",minWidth:0}}>
            <div style=${{display:"flex",alignItems:"center",gap:6}}>
              <span style=${{fontSize:12,fontWeight:700,color:"#f1f5f9",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${r.b.name}</span>
              ${r.lowSample&&html`<span title="Low PA sample — less reliable" style=${{fontSize:8,color:"#eab308",background:"#eab30818",border:"1px solid #eab30844",borderRadius:3,padding:"1px 4px",flexShrink:0}}>⚠ Low PA</span>`}
            </div>
            <div style=${{fontSize:9,color:"#334155",marginTop:1,display:"flex",alignItems:"center",gap:5}}>
              <span>${r.batFor} · ${r.b.pos}</span>
              <span style=${{color:"#1e3a5f"}}>·</span>
              <span style=${{color:r.splitKey==="overall"?"#334155":"#38bdf8"}}>${splitLabel(r.splitKey)}</span>
            </div>
          </div>

          <!-- Batting slot -->
          <div style=${{width:36,flexShrink:0,textAlign:"center"}}>
            <div style=${{fontSize:13,fontWeight:700,color:sc}}>${r.b.slot}</div>
            <div style=${{fontSize:7,color:"#1e3a5f"}}>${ordSfx(r.b.slot).slice(-2)}</div>
          </div>

          <!-- Handedness -->
          <div style=${{width:30,flexShrink:0,textAlign:"center"}}>
            <div style=${{fontSize:11,color:"#64748b"}}>${r.b.hand==="L"?"⬅":r.b.hand==="S"?"↕":"➡"}</div>
            <div style=${{fontSize:7,color:"#1e3a5f"}}>${r.b.hand||"?"}</div>
          </div>

          <!-- vs SP -->
          <div style=${{flex:"1 1 110px",minWidth:0}}>
            <div style=${{fontSize:10,color:"#94a3b8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${r.sp?r.sp.name:"SP TBD"}</div>
            <div style=${{fontSize:8,color:"#334155",marginTop:1}}>
              ${r.batAgainst}${spHandLabel?` · ${spHandLabel}`:""}
            </div>
          </div>

          <!-- Park -->
          <div style=${{flex:"0 0 90px"}}>
            <div style=${{fontSize:9,color:"#64748b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${r.park?.name||"—"}</div>
            <div style=${{fontSize:8,color:r.pf>105?"#f97316":r.pf<95?"#38bdf8":"#334155",marginTop:1}}>PF ${r.pf}${r.pf>105?" ▲":r.pf<95?" ▼":""}</div>
          </div>

          <!-- Wind -->
          <div style=${{flex:"0 0 120px"}}>
            <div style=${{fontSize:9,color:r.wi?.color||"#475569",fontWeight:700}}>${r.wi?r.wi.short:(r.park?.roof?"🏟️ Dome":"—")}</div>
            ${r.wx&&html`<div style=${{fontSize:8,color:"#334155",marginTop:1}}>${r.wx.temp}°${r.wx.unit} · ${r.wx.forecast?.split(" ").slice(0,2).join(" ")}</div>`}
          </div>

          <!-- Chevron -->
          <div style=${{width:18,flexShrink:0,textAlign:"center",fontSize:10,color:open?sc:"#1e3a5f",
            transform:open?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s"}}>▾</div>
        </div>

        <!-- EXPANDED PANEL -->
        ${open&&html`
        <div class="slide" style=${{background:"#08111e",borderBottom:`2px solid ${sc}33`,padding:"14px 18px"}}>
          <div style=${{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12}}>

            <!-- Score Breakdown -->
            <div style=${{background:"#060c16",borderRadius:7,padding:12,border:`1px solid ${sc}33`}}>
              <div style=${{fontSize:9,color:"#38bdf8",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10}}>⚡ Score Breakdown</div>
              ${r.bd&&[
                ["xSLG (primary)",r.bd.xp,"#38bdf8"],
                ["Barrel% (secondary)",r.bd.bp,"#ef4444"],
                ["HardHit% (tertiary)",r.bd.hp,"#f97316"],
                ["Wind bonus",r.bd.wp,r.wi?.color||"#64748b"],
                ["Elevation bonus",r.bd.ep,"#a78bfa"],
              ].map(([label,val,color])=>html`
                <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
                  <span style=${{fontSize:9,color:"#475569"}}>${label}</span>
                  <div style=${{display:"flex",alignItems:"center",gap:6}}>
                    <div style=${{width:Math.max(2,Math.min(60,Math.abs(val)*1.5))+"px",height:3,background:color,borderRadius:2,opacity:.7}}/>
                    <span style=${{fontSize:11,fontWeight:700,color:val>0?color:"#38bdf8",minWidth:30,textAlign:"right"}}>${val>0?"+":""}${val}</span>
                  </div>
                </div>`)}
              <div style=${{borderTop:"1px solid #1a2740",marginTop:8,paddingTop:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style=${{fontSize:9,color:"#475569"}}>Total HR⚡</span>
                <span style=${{fontSize:18,fontWeight:700,color:sc}}>${r.score}</span>
              </div>
              <!-- Split used -->
              <div style=${{marginTop:8,padding:"6px 8px",background:"#070d18",borderRadius:5,border:`1px solid ${r.splitKey==="overall"?"#1a2740":"#38bdf844"}`}}>
                <div style=${{fontSize:8,color:"#334155"}}>Stats used</div>
                <div style=${{fontSize:10,fontWeight:700,color:r.splitKey==="overall"?"#475569":"#38bdf8",marginTop:2}}>
                  ${splitLabel(r.splitKey)}
                  ${r.lowSample&&html` <span style=${{color:"#eab308"}}>⚠ ${r.sc.pa} PA — small sample</span>`}
                </div>
                ${r.splitKey==="overall"&&html`<div style=${{fontSize:8,color:"#1e3a5f",marginTop:2}}>SP hand unknown — using full-season stats</div>`}
              </div>
            </div>

            <!-- Statcast -->
            <div style=${{background:"#060c16",borderRadius:7,padding:12,border:"1px solid #1a2740"}}>
              <div style=${{fontSize:9,color:"#38bdf8",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10}}>
                📊 Statcast — ${splitLabel(r.splitKey)}
              </div>
              <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                ${[
                  ["xSLG",r.sc.xslg?.toFixed(3),"xslg",r.sc.xslg],
                  ["Barrel%",r.sc.barrel?.toFixed(1)+"%","barrel",r.sc.barrel],
                  ["HardHit%",r.sc.hh?.toFixed(1)+"%","hh",r.sc.hh],
                  ["Avg EV",r.sc.ev?.toFixed(1)+" mph","ev",r.sc.ev],
                  ["xwOBA",r.sc.xwoba?.toFixed(3),"xwoba",r.sc.xwoba],
                  ["HRs 2026",r.sc.hr?.toFixed(0),"hr",r.sc.hr],
                  ["xBA",r.sc.xba?.toFixed(3),null,null],
                  ["PA (split)",r.sc.pa?.toFixed(0),null,null],
                ].map(([label,val,key,raw])=>html`
                  <div style=${{background:"#070d18",borderRadius:5,padding:"6px 8px"}}>
                    <div style=${{fontSize:7,color:"#334155",textTransform:"uppercase",letterSpacing:"0.1em"}}>${label}</div>
                    <div style=${{fontSize:13,fontWeight:700,color:key?stColor(raw,key):"#64748b",marginTop:2}}>${val??'—'}</div>
                  </div>`)}
              </div>
            </div>

            <!-- Park + Weather -->
            <div style=${{background:"#060c16",borderRadius:7,padding:12,border:"1px solid #1a2740"}}>
              <div style=${{fontSize:9,color:"#38bdf8",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10}}>🏟️ Park + Weather</div>
              ${[
                ["Venue",r.park?.name||"—","#94a3b8"],
                ["HR Park Factor",`${r.pf}${r.pf>105?" ▲ Friendly":r.pf<95?" ▼ Suppressing":" ≈ Neutral"}`,r.pf>105?"#f97316":r.pf<95?"#38bdf8":"#64748b"],
                ["Elevation",`${r.park?.elev?.toLocaleString()||"—"}ft · +${r.park?((r.park.elev/1000)).toFixed(1):0}% carry`,r.park?.elev>2000?"#f97316":"#64748b"],
                ["Roof",r.park?.roof?"🏟️ Controlled":"☀️ Open air","#64748b"],
                ["Temp",r.wx?`${r.wx.temp}°${r.wx.unit}`:r.park?.roof?"Controlled":"—",r.wx?.temp>85?"#ef4444":r.wx?.temp<50?"#38bdf8":"#64748b"],
                ["Wind",r.wx?.wind||"—",r.wi?.color||"#64748b"],
                ["Wind effect",r.wi?r.wi.label:(r.park?.roof?"Dome — N/A":"—"),r.wi?.color||"#64748b"],
                ["Sky",r.wx?.forecast||"—","#64748b"],
              ].map(([label,val,color])=>html`
                <div style=${{display:"flex",justifyContent:"space-between",gap:8,marginBottom:6}}>
                  <span style=${{fontSize:9,color:"#334155",flexShrink:0}}>${label}</span>
                  <span style=${{fontSize:9,fontWeight:700,color,textAlign:"right"}}>${val}</span>
                </div>`)}
            </div>

          </div>
        </div>`}
      </div>`;
    })}
    </div>

    ${rows.length>0&&html`
    <div style=${{padding:"10px 20px",borderTop:"1px solid #1a2740",fontSize:8,color:"#1e3a5f",lineHeight:2}}>
      HR⚡ Score = (xSLG×28 + Barrel%×2.0 + HardHit%×0.35) × Park Factor + Wind Bonus + Elevation Bonus<br/>
      Stats pulled from platoon-specific Savant leaderboards (LHB vs RHP, RHB vs LHP, etc.) · Switch hitters use opposite side of SP · ⚠ = under ${LOW_PA} PA in that split<br/>
      Only confirmed lineups shown · Tap row to expand · Data: Baseball Savant · MLB Stats API · weather.gov
    </div>`}

  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
